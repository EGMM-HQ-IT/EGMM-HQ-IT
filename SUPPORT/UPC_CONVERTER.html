<!DOCTYPE html>
<!--
  SUPPORT/UPC_CONVERTER.html — UPC 변환 · 바코드 판별 (INDEX > SUPPORT)   (2026-10-09)
  · 누구나 접속 (로그인 없음) · CLOUD 연결 없음 — 입력한 번호를 EAN-8 / UPC-E / UPC-A / EAN-13 / GTIN-14 / CODE128 으로 판별하고 변환
  · 디자인: Paper & Pine (INDEX · 광고뷰어 · 엑셀 내보내기 팝업과 같은 톤) — 기능 모듈(FunctionUpc)은 그대로
-->
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UPC CONVERTER</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{
    --bg:#EDEAE3; --bg-elev:#FFFDFA; --bg-elev-2:#F7F4ED; --border:#E4DFD4; --border-bright:#D6CFC0;
    --text:#1E1B16; --text-dim:#4C463C; --text-faint:#8C8578;
    --accent:#1E1B16; --accent-warm:#2F5D46; --accent-soft:#E9EFEA; --brass:#A98A55; --brass-soft:#F6EFDD;
    --danger:#9C3327; --danger-soft:#F5EAE7; --ok:#1e7a46; --ok-bg:#eef8f1; --warn:#8a6414; --warn-bg:#FBF3DD;
    --sh-1:0 1px 2px rgba(30,27,22,.05); --sh-2:0 1px 2px rgba(30,27,22,.05), 0 14px 30px -20px rgba(30,27,22,.42);
    --font:'Pretendard','Malgun Gothic','맑은 고딕',system-ui,sans-serif; --monof:'JetBrains Mono','Consolas','Pretendard',monospace;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{ background:var(--bg); color:var(--text); font-family:var(--font); overflow:hidden; -webkit-font-smoothing:antialiased; }

  /* ── 크기 토큰 (S/M/L) ── */
  body{ --fs:13px; --fs-sm:11px; --pad:14px; --gap:9px; --btn-h:34px; --rad:16px; --rad-in:11px; --left-w:clamp(320px, 22vw, 400px); --mono:13.5px; --tfs:12.5px; --tmono:13px; }

  #card{ width:100vw; height:100vh; overflow:hidden; display:flex; flex-direction:column; font-size:var(--fs); }

  /* ── 헤더 ── */
  #head{ flex:none; display:flex; align-items:center; gap:12px; padding:calc(var(--pad)*.9) calc(var(--pad)*1.6);
    background:linear-gradient(135deg,#1E1B16 0%,#2F5D46 100%); color:#fff; box-shadow:var(--sh-1); }
  #head .tick{ width:4px; height:1.3em; border-radius:2px; background:var(--brass); flex:none; }
  #head .tt{ font-weight:900; font-size:calc(var(--fs) + 5px); letter-spacing:.12em; text-transform:uppercase; white-space:nowrap; }
  #head .ko{ font-size:var(--fs); font-weight:800; color:rgba(255,255,255,.78); white-space:nowrap; }
  #head .sub{ color:#D8C9A6; font-size:var(--fs-sm); font-weight:700; letter-spacing:.12em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #head .sp{ flex:1; }
  .pv-btn{ display:inline-flex; align-items:center; gap:7px; background:rgba(255,255,255,.08); border:1.5px solid rgba(255,255,255,.22); color:#fff;
    padding:6px 13px; font-family:var(--font); font-size:var(--fs-sm); font-weight:800; border-radius:10px; cursor:pointer; white-space:nowrap; letter-spacing:.04em; }
  .pv-btn:hover{ border-color:var(--brass); color:#F6EFDD; }

  /* ── 본문 ── */
  #bodyc{ flex:1; min-height:0; padding:var(--pad) calc(var(--pad)*1.3) calc(var(--pad)*1.1); display:flex; gap:var(--pad); }
  .pane{ background:var(--bg-elev); border:1.5px solid var(--border); border-radius:var(--rad); box-shadow:var(--sh-2); padding:var(--pad); display:flex; flex-direction:column; gap:var(--gap); min-height:0; }
  #left{ flex:none; width:var(--left-w); }
  #right{ flex:1; min-width:0; }
  .lbl{ flex:none; display:flex; align-items:center; justify-content:space-between; font-size:var(--fs-sm); color:var(--text-faint); font-weight:900; letter-spacing:.14em; text-transform:uppercase; }
  .lbl .ko{ color:var(--accent-warm); letter-spacing:.02em; text-transform:none; margin-left:8px; font-size:calc(var(--fs-sm) + 1px); }
  .lbl .st{ font-weight:800; color:var(--brass); letter-spacing:.02em; text-transform:none; }
  .ta{ flex:1; min-height:0; width:100%; resize:none; border:1.5px solid var(--border); border-radius:var(--rad-in); padding:calc(var(--pad)*.6);
    font-size:var(--mono); font-family:var(--monof); line-height:1.55; background:var(--bg-elev-2); color:var(--text); outline:none; }
  .ta:focus{ border-color:var(--accent-warm); background:#fff; box-shadow:0 0 0 3px rgba(47,93,70,.14); }
  .ta::placeholder{ color:var(--text-faint); }
  .row{ flex:none; display:flex; gap:var(--gap); flex-wrap:nowrap; }
  .row .grow{ flex:1; }
  .btn{ height:var(--btn-h); padding:0 calc(var(--pad)*.8); border:1.5px solid var(--border); border-radius:var(--rad-in); background:var(--bg-elev); color:var(--text-dim);
    font-family:var(--font); font-size:var(--fs); font-weight:800; cursor:pointer; transition:border-color .13s, color .13s, background .13s, transform .08s; white-space:nowrap; }
  .btn:hover{ border-color:var(--accent-warm); color:var(--text); } .btn:active{ transform:scale(.97); }
  .btn.gold{ background:var(--accent-warm); color:#fff; border-color:var(--accent-warm); }
  .btn.gold:hover{ filter:brightness(1.07); color:#fff; }
  .btn.ghost{ background:transparent; }
  .btn.ghost:hover{ border-color:var(--danger); color:var(--danger); background:var(--danger-soft); }
  .btn.tog.on{ background:var(--brass-soft); border-color:var(--brass); color:#6b5424; }

  @media (max-width: 900px){
    #bodyc{ flex-direction:column; }
    #left{ width:auto; flex:none; max-height:48vh; }
    .dual{ min-height:110px; }
  }
  /* ── 요약 칩 ── */
  #sum{ flex:none; display:flex; gap:6px; flex-wrap:wrap; min-height:1.6em; }
  .chip{ display:inline-flex; align-items:center; gap:5px; font-size:var(--fs-sm); font-weight:800; padding:3px 10px; border-radius:20px; border:1.5px solid var(--border); background:var(--bg-elev-2); color:var(--text-dim); }
  .chip b{ color:var(--accent-warm); }

  /* ── 판별 표 ── */
  #tblwrap{ flex:1; min-height:0; overflow:auto; border:1.5px solid var(--border); border-radius:var(--rad-in); background:var(--bg-elev); }
  table{ width:100%; min-width:1400px; border-collapse:separate; border-spacing:0; font-size:var(--tfs); table-layout:fixed; } /* [2026-10-09] 고정 열폭 + 줄바꿈 금지 → 화면 폭에 맞춤 */
  thead th{ position:sticky; top:0; background:var(--accent-warm); color:#fff; font-size:var(--fs-sm); font-weight:800; letter-spacing:.05em; text-align:left; padding:7px 8px; overflow:hidden; text-overflow:ellipsis;
    border-bottom:1px solid var(--border); white-space:nowrap; z-index:1; }
  thead th.hana{ color:#F6EFDD; }
  tbody td{ padding:6px 8px; border-bottom:1px solid var(--border); vertical-align:middle; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; line-height:1.3; }
  tbody tr:nth-child(even) td{ background:var(--bg-elev-2); }
  tbody tr:hover td{ background:var(--accent-soft); }
  td.num{ color:var(--text-faint); text-align:right; }
  td.mono{ font-family:var(--monof); font-size:var(--tmono); letter-spacing:.02em; }
  td.res{ font-family:var(--monof); font-size:var(--tmono); font-weight:800; color:var(--accent-warm); }
  td.note{ color:var(--text-dim); font-size:var(--fs-sm); }
  td.mono.std{ font-size:var(--fs-sm); }
  .badge{ display:inline-block; font-size:var(--fs-sm); font-weight:800; letter-spacing:.03em; padding:2px 8px; border-radius:6px; border:1px solid transparent; white-space:nowrap; }
  .b-ean8  { background:#E6EEF8; color:#1d4f91; border-color:#c5d8f2; }
  .b-upce  { background:#E9EFEA; color:#22633b; border-color:#c8e3cf; }
  .b-upca  { background:#eef8f1; color:#1e7a46; border-color:#bfe0cc; }
  .b-ean13 { background:#F0EAF8; color:#5b3d9e; border-color:#d9cdf1; }
  .b-gtin14{ background:#F6EFDD; color:#6b5424; border-color:#E6D6AE; }
  .b-c128  { background:#ECEAE4; color:#4C463C; border-color:#D6CFC0; }
  .b-amb   { background:var(--warn-bg); color:var(--warn); border-color:#EAD9A8; }
  .b-bad   { background:var(--danger-soft); color:var(--danger); border-color:#DBB6AE; }
  .b-none  { background:#F1EDE2; color:#8C8578; border-color:#E4DFD4; }
  .ck{ font-size:var(--fs-sm); font-weight:700; }
  .ck.ok{ color:var(--ok); } .ck.no{ color:var(--danger); } .ck.na{ color:#999; }
  .empty{ padding:28px; color:var(--text-faint); font-size:var(--fs-sm); font-weight:700; text-align:center; }
  .conf{ display:inline-block; font-size:var(--fs-sm); font-weight:800; padding:1px 8px; border-radius:20px; }
  .c-sure{ background:var(--ok-bg); color:var(--ok); } .c-guess{ background:var(--warn-bg); color:var(--warn); } .c-no{ background:var(--danger-soft); color:var(--danger); }
  .c-master{ background:#E6EEF8; color:#1d4f91; }
  td.cks{ font-family:var(--monof); font-size:var(--fs-sm); color:var(--text-dim); line-height:1.25; white-space:nowrap; }
  td.cks b{ color:var(--text); }
  td.cks .hit{ color:var(--ok); font-weight:800; } td.cks .miss{ color:var(--danger); }
  #master{ flex:none; height:calc(var(--btn-h)*2.2); font-size:var(--fs-sm); display:none; }
  #master.show{ display:block; }
  .dual{ flex:1; min-height:0; display:flex; gap:var(--gap); }
  .dual .ta.hana{ border-color:var(--brass); background:#FFFCF4; }
  .ztag{ display:inline-block; font-size:calc(var(--fs-sm) - 1px); font-weight:800; padding:0 5px; border-radius:4px; margin-left:4px; vertical-align:1px; }
  .z-need{ background:#E6EEF8; color:#1d4f91; } .z-no{ background:#F1EDE2; color:#777; } .z-keep{ background:#F6EFDD; color:#6b5424; }
  td.res.hana{ background:#FFFCF4; color:#6b5424; }
  td.res.na{ color:var(--danger); font-weight:800; }
  .dual .ta{ flex:1; min-width:0; white-space:pre; overflow:auto; font-size:calc(var(--mono) - 1px); padding:calc(var(--pad)*.5); }

  /* ── 토스트 ── */
  .toast{ position:fixed; left:50%; bottom:22px; transform:translateX(-50%) translateY(8px); z-index:99; background:var(--accent); color:#fff;
    font-size:12.5px; font-weight:800; padding:10px 18px; border-radius:12px; box-shadow:0 12px 30px rgba(0,0,0,.25); opacity:0; transition:opacity .2s, transform .2s; pointer-events:none; white-space:nowrap; }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
  .toast.err{ background:var(--danger); }
</style>
</head>
<body>

<div id="card">
  <div id="head">
    <span class="tick"></span>
    <span class="tt">UPC Converter</span>
    <span class="ko">UPC 변환 · 바코드 판별</span>
    <span class="sub">EAN-8 · UPC-E · UPC-A · EAN-13 · GTIN-14 · CODE128 자동 판정</span>
    <span class="sp"></span>
    <button class="pv-btn" id="backBtn" type="button">← 돌아가기</button>
  </div>

  <div id="bodyc">
    <div id="left" class="pane">
      <div class="lbl"><span>Input<span class="ko">입력 · 줄마다 1개 · Ctrl+Enter</span></span><span class="st" id="ist">0줄</span></div>
      <textarea class="ta" id="in" placeholder="바코드 번호를 줄마다 입력&#10;예)&#10;07175732&#10;04139344&#10;041390000034&#10;8801234567890"></textarea>
      <div class="row">
        <button class="btn" id="paste">붙여넣기</button>
        <button class="btn tog" id="mtog" title="상품 마스터(UPC-A·EAN·item_code)를 붙여넣으면 확인불가 번호를 마스터 대조로 확정">마스터 대조</button>
        <button class="btn gold grow" id="conv">변환·판별</button>
      </div>
      <textarea class="ta" id="master" placeholder="상품 마스터 붙여넣기 (선택) — 줄마다 UPC-A 12자리 / EAN-13 / HANA item_code&#10;마스터에 존재하는 해석이 있으면 그쪽으로 확정합니다"></textarea>
      <div class="lbl"><span>Result<span class="ko">변환 결과 · 0 유지 / 0 제거 / HANA</span></span><span class="st" id="ost">0줄</span></div>
      <div class="dual">
        <textarea class="ta" id="out" placeholder="0 유지" readonly title="표준 형식 그대로 (앞자리 0 유지)"></textarea>
        <textarea class="ta" id="out0" placeholder="0 제거" readonly title="앞자리 0 전부 제거"></textarea>
        <textarea class="ta hana" id="outH" placeholder="HANA" readonly title="HANA 컨버터: 0 불필요 → 제거, 0 필요 → 자동 보정"></textarea>
      </div>
      <div class="row">
        <button class="btn" id="copy" title="0 유지 복사">0유지</button>
        <button class="btn" id="copy0" title="0 제거 복사">0제거</button>
        <button class="btn gold grow" id="copyH" title="HANA 컨버터 결과 복사">HANA 복사</button>
        <button class="btn ghost" id="cboth">지우기</button>
      </div>
    </div>

    <div id="right" class="pane">
      <div class="lbl"><span>Analysis<span class="ko">판별 결과</span></span><span class="st" id="rst"></span></div>
      <div id="sum"></div>
      <div id="tblwrap">
        <table>
          <colgroup><col style="width:34px"><col style="width:152px"><col style="width:56px"><col style="width:150px"><col style="width:72px"><col style="width:136px"><col style="width:150px"><col style="width:120px"><col style="width:190px"><col style="width:210px"><col></colgroup>
          <thead><tr>
            <th>#</th><th>입력</th><th>자릿수</th><th>종류</th><th>판정</th><th>체크디짓 (계산/실제)</th><th>변환 (0 유지)</th><th>변환 (0 제거)</th><th class="hana">HANA 컨버터</th><th>표준 형식</th><th>비고</th>
          </tr></thead>
          <tbody id="tb"><tr><td colspan="11" class="empty">번호를 입력하고 변환·판별을 누르세요</td></tr></tbody>
        </table>
      </div>
      <div class="row">
        <button class="btn grow" id="copyTbl">표 복사 (탭 구분)</button>
        <button class="btn" id="copyRes">HANA 결과만 복사</button>
      </div>
    </div>
  </div>
</div>

<script>
/* ============================================================
   FunctionUpc — 공용 UPC 변환 + 바코드 심볼로지 판별 모듈 (v2)
   window.FunctionUpc.convert(rawCode, opts)          : 변환 (기존 호환; opts.hana=true → HANA 컨버터 값)
   window.FunctionUpc.analyze(rawCode, opts)          : 판별 정보 객체
       opts.master   : Set — 정규화된 마스터 키(아래 masterKeys 참고)
   window.FunctionUpc.masterKeys(text)                : 마스터 텍스트 → Set
   window.FunctionUpc.wire(cfg)                       : 화면 연결
   ============================================================ */
(function () {
  'use strict';

  /* ── 체크디짓 ─────────────────────────────────── */
  // GS1 공통: 오른쪽 끝(체크디짓 자리 앞)부터 3,1,3,1… (UPC-A 11, EAN-13 12, EAN-8 7, GTIN-14 13 자리 모두 동일)
  function gs1Check(body) {
    var s = 0, w = 3;
    for (var i = body.length - 1; i >= 0; i--) { s += (body.charCodeAt(i) - 48) * w; w = (w === 3) ? 1 : 3; }
    return String((10 - (s % 10)) % 10);
  }
  function upcCheckDigit(d11) { return gs1Check(d11); }

  // UPC-E(넘버시스템+6자리) → UPC-A 11자리(체크디짓 제외)
  function expandE(u) {
    var ns = u.charAt(0), x1 = u.charAt(1), x2 = u.charAt(2), x3 = u.charAt(3), x4 = u.charAt(4), x5 = u.charAt(5), x6 = u.charAt(6);
    var man, prod;
    if (x6 === '0' || x6 === '1' || x6 === '2') { man = x1 + x2 + x6 + '00'; prod = '00' + x3 + x4 + x5; }
    else if (x6 === '3') { man = x1 + x2 + x3 + '00'; prod = '000' + x4 + x5; }
    else if (x6 === '4') { man = x1 + x2 + x3 + x4 + '0'; prod = '0000' + x5; }
    else { man = x1 + x2 + x3 + x4 + x5; prod = '0000' + x6; }
    return ns + man + prod;
  }
  // UPC-E 정규 압축 여부: GS1 규칙상 UPC-A 하나에 UPC-E는 하나뿐.
  // 패턴3 인데 X3∈{0,1,2} / 패턴4 인데 X4=0 / 패턴5~9 인데 X5=0 이면 더 짧은 패턴으로 눌렸어야 하므로 비정규.
  function canonicalE(u) {
    var x3 = u.charAt(3), x4 = u.charAt(4), x5 = u.charAt(5), x6 = u.charAt(6);
    if (x6 === '3') return !(x3 === '0' || x3 === '1' || x3 === '2');
    if (x6 === '4') return x4 !== '0';
    if (x6 >= '5') return x5 !== '0';
    return true;
  }
  // UPC-A 11자리 → UPC-E 6자리(가능하면) — 마스터 대조·정보 표시용
  function compressA(d11) {
    var ns = d11.charAt(0); if (ns !== '0' && ns !== '1') return null;
    var m = d11.substring(1, 6), p = d11.substring(6, 11);
    if ((m.charAt(2) === '0' || m.charAt(2) === '1' || m.charAt(2) === '2') && m.substring(3) === '00' && p.substring(0, 2) === '00')
      return ns + m.substring(0, 2) + p.substring(2) + m.charAt(2);
    if (m.substring(3) === '00' && p.substring(0, 3) === '000') return ns + m.substring(0, 3) + p.substring(3) + '3';
    if (m.charAt(4) === '0' && p.substring(0, 4) === '0000') return ns + m.substring(0, 4) + p.charAt(4) + '4';
    if (p.substring(0, 4) === '0000' && p.charAt(4) >= '5') return ns + m + p.charAt(4);
    return null;
  }
  function digitsOnly(raw) {
    var code = '';
    for (var i = 0; i < raw.length; i++) { var ch = raw.charAt(i); if (ch >= '0' && ch <= '9') code += ch; }
    return code;
  }
  function stripZ(s) { var t = s.replace(/^0+/, ''); return t === '' ? '0' : t; }

  /* ── GS1 프리픽스 (EAN-8·EAN-13 앞 3자리) ────────── */
  var PREFIX = [
    [0,19,'미국·캐나다 (GS1 US)'],[20,29,'매장 내부용(제한유통)'],[30,39,'미국'],[40,49,'매장 내부용(제한유통)'],[50,59,'쿠폰'],[60,139,'미국·캐나다'],
    [200,299,'매장 내부용(제한유통)'],[300,379,'프랑스'],[380,380,'불가리아'],[383,383,'슬로베니아'],[385,385,'크로아티아'],[387,387,'보스니아'],[389,389,'몬테네그로'],

    function outStrip(a) { return a.len ? (a.type === 'AMB' ? NA : (a.out ? stripZ(a.out) : '')) : ''; }
    function outHana(a) { return a.len ? (a.type === 'AMB' ? NA : (a.type === 'BAD' ? '무효' : a.hana)) : ''; }
    var ZT = { need: ['0필요', 'z-need'], no: ['0불필요', 'z-no'], keep: ['그대로', 'z-keep'] };
    function ztag(a) { if (!a.len || a.type === 'AMB' || a.type === 'BAD') return ''; var z = ZT[a.zero] || ZT.keep; return '<span class="ztag ' + z[1] + '">' + z[0] + '</span>'; }
    function ckHtml(a) {
      if (!a.ck.length) return '<span class="ck na">—</span>';
      return a.ck.map(function (c) { return esc(c.name) + ' <b>' + c.calc + '</b>/' + c.actual + ' <span class="' + (c.hit ? 'hit' : 'miss') + '">' + (c.hit ? '✓' : '✗') + '</span>'; }).join('<br>');
    }
    function render(rows) {
      output.value = rows.map(outKeep).join('\n');
      if (output0) output0.value = rows.map(outStrip).join('\n');
      if (outputH) outputH.value = rows.map(outHana).join('\n');
      updateOutStatus();
      if (!tb) return;
      var html = '', cnt = {}, idx = 0, confCnt = {};
      rows.forEach(function (a) {
        if (!a.len) return; idx++;
        var k = a.label.split(' ')[0]; cnt[k] = (cnt[k] || 0) + 1; confCnt[a.conf] = (confCnt[a.conf] || 0) + 1;
        var cf = CONF[a.conf] || CONF.no;
        html += '<tr><td class="num">' + idx + '</td><td class="mono">' + esc(a.code) + '</td><td class="num">' + a.len + '</td>' +
          '<td><span class="badge ' + a.cls + '">' + esc(a.label) + '</span></td><td><span class="conf ' + cf[1] + '">' + cf[0] + '</span></td>' +
          '<td class="cks">' + ckHtml(a) + '</td><td class="res' + (a.type === 'AMB' ? ' na' : '') + '">' + esc(outKeep(a)) + '</td><td class="res' + (a.type === 'AMB' ? ' na' : '') + '">' + esc(outStrip(a)) + '</td>' +
          '<td class="res hana' + (a.type === 'AMB' || a.type === 'BAD' ? ' na' : '') + '">' + esc(outHana(a)) + ztag(a) + '</td>' +
          '<td class="mono std">' + esc(a.std) + '</td><td class="note">' + esc(a.note) + '</td></tr>';
      });
      tb.innerHTML = html || '<tr><td colspan="11" class="empty">유효한 번호가 없습니다</td></tr>';
      if (sum) {
        var chips = Object.keys(cnt).map(function (k) { return '<span class="chip">' + esc(k) + ' <b>' + cnt[k] + '</b></span>'; });
        chips.push('<span class="chip" style="margin-left:auto">확정 <b>' + ((confCnt.sure || 0) + (confCnt.master || 0)) + '</b> · 확인불가 <b>' + (confCnt.guess || 0) + '</b> · 무효 <b>' + (confCnt.no || 0) + '</b></span>');
        sum.innerHTML = chips.join('');
      }
      if (rst) rst.textContent = idx + '건';
    }
    function doConvert(quiet) {
      if (!input.value.trim()) { if (!quiet) { toast('변환할 내용을 입력하세요', 'error'); input.focus(); } return; }
      var o = { master: curMaster() };
      lastRows = input.value.split(/\r?\n/).map(function (l) { return analyze(l, o); });
      render(lastRows);
      if (quiet) return;
      var amb = lastRows.filter(function (a) { return a.type === 'AMB'; }).length;
      var bad = lastRows.filter(function (a) { return a.conf === 'no' && a.len; }).length;
      var n = lastRows.filter(function (a) { return a.len; }).length;
      toast('✅ ' + n + '개 판별 완료' + (amb ? ' · 확인불가 ' + amb : '') + (bad ? ' · 무효 ' + bad : ''), (bad || amb) ? 'error' : 'success');
    }
    function tableTSV() {
      var lines = ['입력\t자릿수\t종류\t판정\t체크디짓\t변환(0유지)\t변환(0제거)\tHANA\t0필요여부\t표준형식\t비고'];
      lastRows.forEach(function (a) {
        if (!a.len) return;
        var ck = a.ck.map(function (c) { return c.name + ' ' + c.calc + '/' + c.actual + (c.hit ? ' ✓' : ' ✗'); }).join(', ');
        lines.push([a.code, a.len, a.label, (CONF[a.conf] || CONF.no)[0], ck, outKeep(a), outStrip(a), outHana(a), (a.len && a.type !== 'AMB' && a.type !== 'BAD') ? (ZT[a.zero] || ZT.keep)[0] : '', a.std, a.note].join('\t'));
      });
      return lines.length > 1 ? lines.join('\n') : '';
    }

    if (cfg.convertBtn && $(cfg.convertBtn)) $(cfg.convertBtn).onclick = function () { doConvert(); };
    input.addEventListener('input', updateInStatus);
    input.addEventListener('keydown', function (e) { if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); doConvert(); } });
    if (cfg.clearBothBtn && $(cfg.clearBothBtn)) $(cfg.clearBothBtn).onclick = function () {
      input.value = ''; output.value = ''; if (output0) output0.value = ''; if (outputH) outputH.value = ''; lastRows = []; updateInStatus(); updateOutStatus();
      if (tb) tb.innerHTML = '<tr><td colspan="11" class="empty">번호를 입력하고 변환·판별을 누르세요</td></tr>';
      if (sum) sum.innerHTML = ''; if (rst) rst.textContent = ''; input.focus();
    };
    if (cfg.copyBtn && $(cfg.copyBtn)) $(cfg.copyBtn).onclick = function () { copyText(output.value, '✅ 0 유지 결과 복사'); };
    if (cfg.copy0Btn && $(cfg.copy0Btn) && output0) $(cfg.copy0Btn).onclick = function () { copyText(output0.value, '✅ 0 제거 결과 복사 (HANA)'); };
    if (cfg.copyHBtn && $(cfg.copyHBtn) && outputH) $(cfg.copyHBtn).onclick = function () { copyText(outputH.value, '✅ HANA 컨버터 결과 복사'); };
    if (cfg.copyResBtn && $(cfg.copyResBtn)) $(cfg.copyResBtn).onclick = function () { copyText((outputH || output0 || output).value, '✅ HANA 결과 복사'); };
    if (cfg.copyTableBtn && $(cfg.copyTableBtn)) $(cfg.copyTableBtn).onclick = function () { copyText(tableTSV(), '✅ 표 복사 (엑셀에 붙여넣기 가능)'); };
    if (cfg.pasteBtn && $(cfg.pasteBtn)) $(cfg.pasteBtn).onclick = function () {
      if (navigator.clipboard && navigator.clipboard.readText) {
        navigator.clipboard.readText().then(function (t) { input.value = t; updateInStatus(); toast('붙여넣기 완료', 'success'); doConvert(); })
          .catch(function () { toast('직접 Ctrl+V 로 붙여넣어 주세요', 'error'); });
      } else { toast('직접 Ctrl+V 로 붙여넣어 주세요', 'error'); }
    };
    updateInStatus(); updateOutStatus();
    return { convert: doConvert };
  }

  window.FunctionUpc = { convert: convert, analyze: analyze, masterKeys: masterKeys, wire: wire };
})();
</script>
<script>
  window.showToast = function (msg, type) {
    var t = document.createElement('div'); t.className = 'toast' + (type === 'error' ? ' err' : ''); t.textContent = msg;
    document.body.appendChild(t); requestAnimationFrame(function () { t.classList.add('show'); });
    setTimeout(function () { t.classList.remove('show'); setTimeout(function () { if (t.parentNode) t.parentNode.removeChild(t); }, 250); }, 2000);
  };
  /* 팝업(iframe)에서 열리면 돌아가기 숨김 · 긴 셀(표준 형식·비고)은 줄바꿈 없이 말줄임 + 마우스 올리면 전체 표시 */
  (function(){ var emb=false; try{ emb=(window.parent&&window.parent!==window); }catch(e){} if(emb){ document.getElementById('backBtn').style.display='none'; }
    var tb=document.getElementById('tb'); new MutationObserver(function(){ Array.prototype.forEach.call(tb.querySelectorAll('td'),function(td){ if(!td.getAttribute('title')) td.setAttribute('title',td.textContent); }); }).observe(tb,{childList:true}); })();
  document.getElementById('backBtn').onclick=function(){ if(window.opener && !window.opener.closed){ window.close(); return; } if(window.history.length>1){ window.history.back(); return; } window.location.href='../index.html'; };
  FunctionUpc.wire({ input: 'in', output: 'out', output0: 'out0', outputH: 'outH', convertBtn: 'conv', pasteBtn: 'paste', copyBtn: 'copy', copy0Btn: 'copy0', copyHBtn: 'copyH', clearBothBtn: 'cboth',
    inputStatus: 'ist', outputStatus: 'ost', tableBody: 'tb', summary: 'sum', resultStatus: 'rst',
    copyTableBtn: 'copyTbl', copyResBtn: 'copyRes', masterInput: 'master', masterToggleBtn: 'mtog' });
</script>
</body>
</html>
