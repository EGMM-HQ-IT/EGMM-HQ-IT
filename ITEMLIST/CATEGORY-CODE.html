<!DOCTYPE html>
<!--
  CATEGORY-CODE.html — CATEGORY CODE · EGMM > MART   (2026-10-08)
  ---------------------------------------------------------------------
  · 매장 공통 상품 분류 코드 A-BB-CC 를 만들고 관리 (추가 · 수정 · 삭제)
      A  = 대분류 번호 (1 GROCERY · 2 ALCOHOL · 3 ETC · 4 PRODUCE · 5 FISH · 6 MEAT · 7 DELI · 8 HOUSEWARE …)
      BB = 중분류 코드 (KOREA FOOD · JAPAN FOOD · BEER …)  CC = 소분류 코드 (RICE · NOODLE · CHIP …, 00 = 전체)
  · 저장: CATEGORY/_CODE = { ver:1, savedAt, fmt:'GZ', d:gzip+base64( { bigs:[{a,name,mids:[{bb,name,subs:[{cc,name}]}]}], link:{ 'PLU-LIST':필드키, 'UPC-LIST':필드키 } } ) }
      PLU/UPC MANAGER 가 이 문서를 실시간 구독 →
        · 상품의 CATEGORY ENG 값이 등록된 소분류 이름과 같고 그 이름이 전체에서 하나뿐이면 연결 필드(기본 CATEGORY NO)에 A-BB-CC 자동 생성
        · 같은 이름이 여러 중분류에 있으면 연결 필드 셀의 드롭다운(대분류 › 중분류 › 소분류)에서 직접 선택
        · 등록되지 않은 이름(오타)은 가장 비슷한 소분류 이름으로 고치도록 유도
  · 초기 데이터: ITEM_CATEGORY.xlsx (2026-10-08) — CLOUD 에 문서가 없을 때 한 번 불러와 저장
  · Firestore 규칙: match /CATEGORY/{document=**} { allow read, write: if request.auth != null; }
-->

  .panel h2 .cnt{ font-size:11px; color:var(--text-faint); font-weight:700; }
  .list{ max-height:66vh; overflow:auto; }
  .it{ display:flex; align-items:center; gap:6px; padding:5px 7px; border:1px solid var(--border); border-radius:9px; margin-bottom:5px; background:var(--bg-elev-2); cursor:pointer; }
  .it.on{ background:var(--sel); border-color:var(--accent); }
  .it input{ font:inherit; font-size:12.5px; font-weight:700; padding:4px 7px; border:1.5px solid transparent; border-radius:7px; background:transparent; color:var(--text); min-width:0; }
  .it input:hover,.it input:focus{ border-color:var(--border-bright); background:var(--bg-elev); outline:none; }
  .it input.code{ width:46px; text-align:center; font-variant-numeric:tabular-nums; color:var(--accent); } .it input.code.a{ width:36px; }
  .it input.name{ flex:1; } .it input.kor{ flex:1; }
  .it .tx{ font-size:12.5px; font-weight:700; padding:4px 2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; } .it .tx.code{ width:46px; text-align:center; color:var(--accent); font-variant-numeric:tabular-nums; flex:none; } .it .tx.code.a{ width:36px; }
  .it .tx.name{ flex:1 1 auto; min-width:0; } .it .tx.kor{ flex:0 1 auto; min-width:0; max-width:45%; color:var(--text-dim); font-weight:600; }
  .it.edit{ cursor:default; background:var(--bg-elev); border-color:var(--accent-warm); }
  .ico.ok{ color:var(--accent-warm); } .ico.ok:hover{ color:var(--accent-warm); background:var(--accent-soft); }
  .it .full{ font-size:11px; color:var(--text-faint); font-weight:700; white-space:nowrap; font-variant-numeric:tabular-nums; }
  .it .sub{ font-size:11px; color:var(--text-faint); font-weight:700; white-space:nowrap; }
  .ico{ border:none; background:transparent; cursor:pointer; font-size:12px; color:var(--text-faint); padding:2px 5px; border-radius:5px; } .ico:hover{ background:var(--bg); color:var(--danger); }

  .toast{ position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:#1f2a1f; color:#fff; padding:9px 16px; border-radius:10px; font-weight:800; opacity:0; pointer-events:none; transition:opacity .2s; z-index:50; }

      </div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>
<div class="modal-bg" id="modalBg"><div class="modal"><h3 id="mTitle"></h3><p id="mText"></p><input type="text" id="mInput" style="display:none" autocomplete="off"><div class="row"><button class="btn ghost" id="mCancel" type="button">취소</button><button class="btn" id="mOk" type="button">확인</button></div></div></div>

  function u8ToB64(u8){ var s=''; for(var i=0;i<u8.length;i+=0x8000){ s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000)); } return btoa(s); }

    return { bigs:bigs, link:link }; }

  /* ── 검증 (저장 전) ── */
  function validate(){ var errs=[], seenA={};

  }
  function save(){

  /* 리스트별 필드 목록 (_CONFIG) — 연결 필드 선택용 */

    '3. PLU · UPC MANAGER 자동 생성: 상품의 CATEGORY ENG 값이 등록된 소분류 이름과 같고, 그 이름이 전체 소분류 중 하나뿐이면 연결 필드(기본 CATEGORY NO)에 A-BB-CC 가 자동으로 들어갑니다. (소분류 목록의 「자동」 표시)',
    '4. 같은 이름이 여러 중분류에 있으면(예: RICE · ETC — 「중복명」 표시) 상품의 연결 필드 셀을 눌러 대분류 › 중분류 › 소분류 드롭다운에서 직접 고릅니다. 고르면 CATEGORY ENG 도 그 소분류 이름으로 맞춰집니다.',
    '5. 등록되지 않은 이름(오타, 예: RIEC)을 CATEGORY ENG 에 넣으면 가장 비슷한 소분류 이름(RICE)으로 고칠지 물어봅니다. 엑셀 불러오기 뒤에는 맞지 않은 이름 목록을 한 번에 보여줍니다.',
    '6. 연결 필드는 리스트(PLU LIST · UPC LIST)별로 바꿀 수 있습니다. 감지(매칭)에 쓰는 값은 CATEGORY ENG 로 고정입니다.',
    '7. 엑셀 불러오기는 ITEM_CATEGORY.xlsx 원본 형식과, 「엑셀 내보내기」 평면 형식(A · 대분류 · 대분류(한글) · BB · 중분류 · 중분류(한글) · CC · 소분류 · 소분류(한글)) 둘 다 읽습니다. 불러오면 화면의 코드 전체가 파일 내용으로 바뀝니다.',
    '8. 삭제해도 상품에 이미 기록된 코드 값은 지워지지 않습니다.'
  ].join('\n');
  $('btnGuide').onclick=function(){ $('guideBg').classList.add('show'); }; $('guideX').onclick=function(){ $('guideBg').classList.remove('show'); };
  function reloadAll(){ return Promise.all([load(),loadFields('PLU-LIST'),loadFields('UPC-LIST')]).then(function(){ selA=D.bigs.length?0:-1; selB=-1; render(); renderLink(); }); }

  });
  window.__CC={ setFb:function(f){ F=f; db=f.db||{}; return reloadAll(); }, state:function(){ return {D:D,selA:selA,selB:selB,dirty:dirty,savedAt:savedAt}; }, select:function(a,b){ selA=a; selB=b; render(); }, save:save, parseWorkbook:parseWorkbook, code:code, render:render };
})();
