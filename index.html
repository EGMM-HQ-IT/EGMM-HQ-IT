<div class="toast" id="toast"></div>

<!-- Confirm Modal -->
<div class="modal-bg" id="modal">
  <div class="modal">
    <h3 id="modalTitle">잠그시겠습니까?</h3>
    <p id="modalText">저장하지 않은 변경사항은 사라집니다.</p>
    <div class="modal-actions">
      <button class="btn ghost" id="modalCancel">취소</button>
      <button class="btn" id="modalConfirm">확인</button>
    </div>
  </div>
</div>

<script>
(function(){
  'use strict';

  // ========== STATE ==========
  let state = {
    events: [],
    notes: [],
    claudeNotes: [],
    isDirty: false,
    viewYear: 0,
    viewMonth: 0,
    selectedDate: null,
    mode: null  // 'cloud' | null
  };

  const MONTH_NAMES = ['JANUARY','FEBRUARY','MARCH','APRIL','MAY','JUNE','JULY','AUGUST','SEPTEMBER','OCTOBER','NOVEMBER','DECEMBER'];
  const MONTH_NAMES_SHORT = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
  const DAY_NAMES = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const DAY_NAMES_KO = ['일요일','월요일','화요일','수요일','목요일','금요일','토요일'];

  // ========== CRYPTO ==========
  function encrypt(data, password) {
    return CryptoJS.AES.encrypt(JSON.stringify(data), password).toString();
  }
  function decrypt(ciphertext, password) {
    try {
      const text = CryptoJS.AES.decrypt(ciphertext, password).toString(CryptoJS.enc.Utf8);
      if (!text) return null;
      return JSON.parse(text);
    } catch (e) {
      return null;
    }
  }

  // ========== DOM ==========
  const $ = id => document.getElementById(id);
  const lockScreen = $('lockScreen');
  const menuScreen = $('menuScreen');
  const app = $('app');
  const lockTitle = $('lockTitle');
  const lockErr = $('lockErr');
  const calendarEl = $('calendar');
  const toast = $('toast');
  const panelBg = $('panelBg');
  const modal = $('modal');

  // ========== UTIL ==========
  function pad(n) { return String(n).padStart(2, '0'); }
  function dateKey(y, m, d) { return `${y}-${pad(m+1)}-${pad(d)}`; }
  function todayKey() {
    const t = new Date();
    return dateKey(t.getFullYear(), t.getMonth(), t.getDate());
  }
  function parseDateKey(key) {
    const [y, m, d] = key.split('-').map(Number);
    return { y, m: m-1, d };
  }
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
  }
  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  // ========== LUNAR CALENDAR ==========
  // 양력 → 음력 변환 ({year, month, day, intercalation}) 반환
  function solarToLunar(year, month, day) {
    try {
      const cal = new KoreanLunarCalendar();
      cal.setSolarDate(year, month, day);
      const iso = cal.getLunarIsoFormat(); // "YYYY-MM-DD" 또는 "YYYY-MM-DD Intercalation"
      const isLeap = iso.includes('Intercalation');
      const [y, m, d] = iso.split(' ')[0].split('-').map(Number);
      return { year: y, month: m, day: d, isLeap };
    } catch (e) {
      return null;
    }
  }

  // 음력 → 양력 변환 ({year, month, day}) 반환
  function lunarToSolar(year, month, day, isLeap = false) {
    try {
      const cal = new KoreanLunarCalendar();
      cal.setLunarDate(year, month, day, isLeap);
      const iso = cal.getSolarIsoFormat(); // "YYYY-MM-DD"
      const [y, m, d] = iso.split('-').map(Number);
      return { year: y, month: m, day: d };
    } catch (e) {
      return null;
    }
  }

  // 음력 생일 → 특정 양력 연도의 양력 날짜
  function lunarBirthdayToSolarDate(lunarMonth, lunarDay, solarYear) {
    // 해당 양력 연도와 일치하는 음력 연도를 찾아서 변환
    // 1월~2월은 보통 음력 연도가 한 해 전
    let result = lunarToSolar(solarYear, lunarMonth, lunarDay, false);
    if (result && result.year === solarYear) return result;
    // 한 해 전 음력으로 시도
    result = lunarToSolar(solarYear - 1, lunarMonth, lunarDay, false);
    if (result && result.year === solarYear) return result;
    // 한 해 후 음력으로 시도
    result = lunarToSolar(solarYear + 1, lunarMonth, lunarDay, false);
    if (result && result.year === solarYear) return result;
    // 셋 다 양력 연도가 안 맞으면, 가장 기본인 해당 연도 변환값을 반환
    return lunarToSolar(solarYear, lunarMonth, lunarDay, false);
  }

  // ========== TOAST ==========
  let toastTimer;
  function showToast(msg, type) {
    clearTimeout(toastTimer);
    toast.textContent = msg;
    toast.className = 'toast show ' + (type || '');
    toastTimer = setTimeout(() => {
      toast.className = 'toast ' + (type || '');
    }, 2500);
  }
  // 외부 IIFE(UPC, Bible 등)에서도 사용할 수 있게 전역 노출
  window.showToast = showToast;

  // ========== MODAL ==========
  function showModal(title, text, onConfirm) {
    $('modalTitle').textContent = title;
    $('modalText').textContent = text;
    modal.classList.add('show');
    const confirmHandler = () => {
      modal.classList.remove('show');
      $('modalConfirm').removeEventListener('click', confirmHandler);
      onConfirm();
    };
    $('modalConfirm').addEventListener('click', confirmHandler);
    $('modalCancel').onclick = () => {
      modal.classList.remove('show');
      $('modalConfirm').removeEventListener('click', confirmHandler);
    };
  }

  // ========== LOCK ==========
  // ========== AUTH MODES ==========
  function setLoginMode() {
    $('loginMode').style.display = 'block';
    $('signupMode').style.display = 'none';
    lockTitle.textContent = 'MANAGER';
    lockErr.textContent = '';
    setTimeout(() => $('loginEmail').focus(), 100);
  }
  function setSignupMode() {
    $('loginMode').style.display = 'none';
    $('signupMode').style.display = 'block';
    lockTitle.textContent = 'MANAGER';
    lockErr.textContent = '';
    setTimeout(() => $('signupEmail').focus(), 100);
  }

  // 모드 전환 버튼
  $('toSignupBtn').onclick = setSignupMode;
  $('toLoginBtn').onclick = setLoginMode;
  // EGMM 박스 → 비밀번호 확인(팝업) 후 별도 페이지(EGMM/egmm.html)로 이동
  let egmmPin = '10041004';                        // EGMM 마스터 PIN(이름 선택 안 함=관리자). 저장값은 해시/레거시평문. 절대 DOM 노출 안 함
  // PIN 해시 (안전컨텍스트=HTTPS면 SHA-256, 아니면 평문 폴백). 저장값은 'h:'/'p:'/레거시평문 중 하나.
  async function hashPin(v){
    v=String(v);
    if(window.crypto && window.crypto.subtle){
      try{ var buf=await window.crypto.subtle.digest('SHA-256', new TextEncoder().encode('THE-SHAWN::'+v));
        return 'h:'+Array.from(new Uint8Array(buf)).map(function(b){return b.toString(16).padStart(2,'0');}).join(''); }catch(e){}
    }
    return 'p:'+v;
  }
  async function verifyPin(entered){
    entered=String(entered||'').trim(); var stored=String(egmmPin||'').trim();
    if(stored.slice(0,2)==='h:' || stored.slice(0,2)==='p:') return (await hashPin(entered))===stored;
    return entered===stored;   // 레거시 평문/기본값(첫 변경 시 해시로 전환됨)
  }
  // ===== EGMM 사용자 (app-config/egmm-users) =====
  var egmmUsers=[];
  function fillEgmmUserPick(){ var sel=$('egmmUserPick'); if(!sel) return; var opts='<option value="">MANAGER</option>'; egmmUsers.forEach(function(u){ opts+='<option value="'+u.id+'">'+String(u.name||'').replace(/</g,'&lt;')+'</option>'; }); var keep=sel.value; sel.innerHTML=opts; sel.value=keep||''; }
  function loadEgmmUsers(){ fillEgmmUserPick(); if(!window.firebaseFns || !window.firebaseDb) return; try{ window.firebaseFns.getDoc(window.firebaseFns.doc(window.firebaseDb,'app-config','egmm-users')).then(function(snap){ var d=(snap&&snap.exists&&snap.exists())?(snap.data()||{}):{}; egmmUsers=Array.isArray(d.users)?d.users:[]; fillEgmmUserPick(); }).catch(function(){}); }catch(e){} }
  async function matchUserPin(entered, stored){ entered=String(entered||'').trim(); stored=String(stored||''); if(stored.slice(0,2)==='h:'||stored.slice(0,2)==='p:') return (await hashPin(entered))===stored; return entered===stored; }
  const EGMM_PIN_COL = 'app-config', EGMM_PIN_DOC = 'egmm';
  function loadEgmmPin(){
    if(!window.firebaseFns || !window.firebaseDb){ setTimeout(loadEgmmPin, 600); return; }
    try{
      if(window.firebaseFns.onSnapshot){
        window.firebaseFns.onSnapshot(window.firebaseFns.doc(window.firebaseDb, EGMM_PIN_COL, EGMM_PIN_DOC), function(snap){
          var d=(snap&&snap.exists&&snap.exists())?(snap.data()||{}):null;
          if(d && d.pin!=null && String(d.pin).trim()!=='') egmmPin=String(d.pin).trim();
        }, function(){});
      } else {
        window.firebaseFns.getDoc(window.firebaseFns.doc(window.firebaseDb, EGMM_PIN_COL, EGMM_PIN_DOC)).then(function(snap){
          var d=(snap&&snap.exists&&snap.exists())?(snap.data()||{}):null;
          if(d && d.pin!=null && String(d.pin).trim()!=='') egmmPin=String(d.pin).trim();
        }).catch(function(){});
      }
    }catch(e){}
  }
  loadEgmmPin();
  const EGMM_AUTO_KEY = 'egmmAutoLogin';
  const egmmPwOv = $('egmmPwOv'), egmmPwInput = $('egmmPwInput'), egmmPwErr = $('egmmPwErr'), egmmAutoChk = $('egmmAutoChk');
  const isEgmmAuto = () => { try{ return localStorage.getItem(EGMM_AUTO_KEY)==='1'; }catch(e){ return false; } };
  const openEgmmPw = () => { if(egmmPwErr) egmmPwErr.textContent=''; if(egmmPwInput) egmmPwInput.value=''; if(egmmAutoChk) egmmAutoChk.checked=isEgmmAuto(); var __up=$('egmmUserPick'); if(__up) __up.value=''; loadEgmmUsers(); egmmPwOv.classList.add('show'); setTimeout(()=>{ if(egmmPwInput) egmmPwInput.focus(); }, 80); };
  const closeEgmmPw = () => egmmPwOv.classList.remove('show');
  const submitEgmmPw = async () => {
    const p = (egmmPwInput && egmmPwInput.value || '').trim();
    const sel = $('egmmUserPick'); const uid = sel ? sel.value : '';
    try{ localStorage.setItem(EGMM_AUTO_KEY, (egmmAutoChk && egmmAutoChk.checked) ? '1' : '0'); }catch(e){}
    if(!uid){
      // 이름 선택 안 함 → 관리자 (마스터 PIN)
      if (await verifyPin(p)) {
        try{ localStorage.setItem('unifiedLogin','1'); sessionStorage.setItem('egmmGate','1'); sessionStorage.setItem('egmmUser', JSON.stringify({name:'', menus:{}})); }catch(e){}
        window.location.href = 'EGMM/egmm.html';
      } else { if(egmmPwErr) egmmPwErr.textContent = '마스터 PIN이 올바르지 않습니다'; }
      return;
    }
    // 사용자 선택 → 해당 사용자 PIN 이어야 함
    var u = egmmUsers.filter(function(x){ return String(x.id)===uid; })[0];
    if (u && await matchUserPin(p, u.pin)) {
      try{ localStorage.setItem('unifiedLogin','1'); sessionStorage.setItem('egmmGate','1'); sessionStorage.setItem('egmmUser', JSON.stringify({name:u.name, menus:u.menus||{}})); }catch(e){}
      window.location.href = 'EGMM/egmm.html';
    } else { if(egmmPwErr) egmmPwErr.textContent = '해당 사용자의 PIN이 아닙니다'; }
  };
  const enterEgmm = () => {
    if (isEgmmAuto()) {   // 자동 로그인 ON → 안 묻고 안내 후 진입 (관리자)
      try { showToast('자동 로그인 합니다', 'success'); } catch(e) {}
      try{ localStorage.setItem('unifiedLogin','1'); sessionStorage.setItem('egmmGate','1'); sessionStorage.setItem('egmmUser', JSON.stringify({name:'', menus:{}})); }catch(e){}
      setTimeout(()=>{ window.location.href = 'EGMM/egmm.html'; }, 600);
      return;
    }
    openEgmmPw();
  };
  $('toOdpBtn').onclick = () => enterEgmm();
  $('toOdpBtn').addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); enterEgmm(); }
  });
  // ===== 아이디/패스워드 스코프 로그인 (index 화면 팝업) — CAMPEON · ITEM ANALYZE =====
  // H-MART 처럼 index 화면에서 팝업으로 로그인 → 성공 시 대상 페이지로 이동(대상 페이지는 게이트로 로그인 생략).
  function initScopeGate(cfg){
    var ov=$(cfg.ov); if(!ov) return function(){};
    var scopeUsers=[];
    function fillSel(){
      var sel=$(cfg.userSel); if(!sel) return;
      if(!scopeUsers.length){ sel.innerHTML='<option value="">등록된 아이디 없음</option>'; return; }
      sel.innerHTML=scopeUsers.map(function(u,i){ return '<option value="'+i+'">'+String(u.name||'').replace(/</g,'&lt;')+'</option>'; }).join('');
    }
    function loadScope(){
      if(!window.firebaseFns || !window.firebaseDb){ setTimeout(loadScope,400); return; }
      try{
        window.firebaseFns.getDoc(window.firebaseFns.doc(window.firebaseDb,'app-config',cfg.doc)).then(function(snap){
          var d=(snap&&snap.exists&&snap.exists())?(snap.data()||{}):{};
          scopeUsers=Array.isArray(d.users)?d.users.filter(function(u){return u&&u.name;}):[];
          fillSel();
        }).catch(function(){ var sel=$(cfg.userSel); if(sel) sel.innerHTML='<option value="">불러오기 실패 — 새로고침</option>'; });
      }catch(e){}
    }
    function scopeAuto(){ try{ return localStorage.getItem(cfg.autoKey)==='1'; }catch(e){ return false; } }
    function open(){
      var e=$(cfg.err); if(e) e.textContent='';
      var p=$(cfg.pwInput); if(p) p.value='';
      var a=$(cfg.autoChk); if(a) a.checked=scopeAuto();
      var sel=$(cfg.userSel); if(sel) sel.value='';
      loadScope(); ov.classList.add('show');
      setTimeout(function(){ var pp=$(cfg.pwInput); if(pp) pp.focus(); }, 80);
    }
    function close(){ ov.classList.remove('show'); }
    async function submit(){
      var err=$(cfg.err); if(err) err.textContent='';
      var sel=$(cfg.userSel), pw=($(cfg.pwInput)&&$(cfg.pwInput).value||'').trim();
      var i=sel?parseInt(sel.value,10):NaN;
      var u=(!isNaN(i)&&scopeUsers[i])?scopeUsers[i]:null;
      if(!u){ if(err) err.textContent='아이디를 선택하세요'; return; }
      if(!pw){ if(err) err.textContent='PASSWORD 를 입력하세요'; var p=$(cfg.pwInput); if(p) p.focus(); return; }
      if(await matchUserPin(pw, u.pin)){
        try{
          sessionStorage.setItem(cfg.gateKey,'1');
          var uj=JSON.stringify({name:u.name, id:u.id||'', menus:u.menus||{}});
          sessionStorage.setItem(cfg.userKey, uj);
          var auto=$(cfg.autoChk)&&$(cfg.autoChk).checked;
          localStorage.setItem(cfg.autoKey, auto?'1':'0');
          if(auto) localStorage.setItem(cfg.userKey, uj); else localStorage.removeItem(cfg.userKey);
        }catch(e){}
        window.location.href=cfg.dest;
      } else {
        if(err) err.textContent='PASSWORD 가 올바르지 않습니다';
        var p2=$(cfg.pwInput); if(p2) p2.select();
      }
    }
    var btn=$(cfg.btn); if(btn) btn.onclick=submit;
    var cl=$(cfg.closeBtn); if(cl) cl.onclick=close;
    ov.addEventListener('click', function(ev){ if(ev.target===ov) close(); });
    var pin=$(cfg.pwInput); if(pin) pin.addEventListener('keydown', function(ev){ if(ev.key==='Enter') submit(); });
    return open;
  }
  const openCampeonPw = initScopeGate({ ov:'cwLoginOv', userSel:'cwLoginUser', pwInput:'cwLoginPw', err:'cwLoginErr', autoChk:'cwLoginAuto', btn:'cwLoginBtn', closeBtn:'cwLoginClose', doc:'campeon-users', gateKey:'campeonGate', userKey:'campeonUser', autoKey:'campeonAutoLogin', dest:'campeon-wholsale.html' });
  // PLU PREVIEW — 매장 선택(조회 전용, PIN 없음) → tablet-plu-preview.html 이동
  const PP_STORES = ['TACOMA','FEDERALWAY','BELLEVUE','BALLARD','REDMOND','LYNNWOOD','G-MART','MELLOW WAY','DISTRICT-H','M2M','UNIVERSITY'];
  const PP_STORE_KEY = 'theShawnStore';   // H-MART 와 동일 매장값 공유
  const PP_AUTO_KEY = 'pluPreviewAuto';
  const ppLoginOv = $('ppLoginOv'), ppStoreSel = $('ppStore'), ppLoginErr = $('ppLoginErr'), ppAutoChk = $('ppAutoChk');
  const isPpAuto = () => { try{ return localStorage.getItem(PP_AUTO_KEY)==='1'; }catch(e){ return false; } };
  const savedPpStore = () => { try{ var s=localStorage.getItem(PP_STORE_KEY); return (s && PP_STORES.indexOf(s)>=0)?s:''; }catch(e){ return ''; } };
  const fillPpStores = () => { if(!ppStoreSel) return; ppStoreSel.innerHTML='<option value="">SELECT STORE</option>'+PP_STORES.map(s=>'<option value="'+s+'">'+s+'</option>').join(''); };
  const openPluPreview = () => {
    // 이 매장 기억하기가 켜져 있으면 바로 입장
    if(isPpAuto() && savedPpStore()){ try{ localStorage.setItem(PP_STORE_KEY, savedPpStore()); }catch(e){} window.location.href='tablet-plu-preview.html'; return; }
    if(ppLoginErr) ppLoginErr.textContent=''; fillPpStores();
    var sv=savedPpStore(); if(ppStoreSel) ppStoreSel.value=sv;
    if(ppAutoChk) ppAutoChk.checked=isPpAuto();
    ppLoginOv.classList.add('show');
    setTimeout(()=>{ if(ppStoreSel) ppStoreSel.focus(); }, 80);
  };
  const closePluPreview = () => ppLoginOv.classList.remove('show');
  const submitPluPreview = () => {
    const store=(ppStoreSel && ppStoreSel.value || '').trim();
    if(ppLoginErr) ppLoginErr.textContent='';
    if(!store){ if(ppLoginErr) ppLoginErr.textContent='매장을 선택하세요'; return; }
    try{ localStorage.setItem(PP_STORE_KEY, store); }catch(e){}
    try{ localStorage.setItem(PP_AUTO_KEY, (ppAutoChk && ppAutoChk.checked)?'1':'0'); }catch(e){}
    window.location.href='tablet-plu-preview.html';
  };
  if($('ppLoginBtn')) $('ppLoginBtn').onclick = submitPluPreview;
  if($('ppLoginClose')) $('ppLoginClose').onclick = closePluPreview;
  if(ppLoginOv) ppLoginOv.addEventListener('click', e => { if(e.target===ppLoginOv) closePluPreview(); });
  const openAnalyzePw = initScopeGate({ ov:'iaLoginOv', userSel:'iaLoginUser', pwInput:'iaLoginPw', err:'iaLoginErr', autoChk:'iaLoginAuto', btn:'iaLoginBtn', closeBtn:'iaLoginClose', doc:'item-analyze-users', gateKey:'analyzeGate', userKey:'analyzeUser', autoKey:'analyzeAutoLogin', dest:'item-management-analyze.html' });

  // CAMPEON WHOLESALE 박스 → index 팝업 로그인
  if($('toCampeonBtn')){
    $('toCampeonBtn').onclick = () => openCampeonPw();
    $('toCampeonBtn').addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openCampeonPw(); } });
  }
  // PLU PREVIEW 박스 → 매장 선택 팝업
  if($('toPluPreviewBtn')){
    $('toPluPreviewBtn').onclick = () => openPluPreview();
    $('toPluPreviewBtn').addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openPluPreview(); } });
  }
  // ITEM ANALYZE 박스 → index 팝업 로그인
  if($('toAnalyzeBtn')){
    $('toAnalyzeBtn').onclick = () => openAnalyzePw();
    $('toAnalyzeBtn').addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openAnalyzePw(); } });
  }
  $('egmmPwBtn').onclick = submitEgmmPw;
  $('egmmPwClose').onclick = closeEgmmPw;
  egmmPwOv.addEventListener('click', e => { if (e.target === egmmPwOv) closeEgmmPw(); });
  if(egmmPwInput) egmmPwInput.addEventListener('keydown', e => { if (e.key === 'Enter') submitEgmmPw(); });

  // EGMM PIN 변경 (MANAGER 로그인 후 상단 🔑 버튼)
  const egmmPinOv = $('egmmPinOv');
  const openEgmmPin = () => {
    var m=$('egmmPinMsg'); if(m){ m.textContent=''; m.style.color=''; }
    var o=$('egmmPinOld'), n1=$('egmmPinNew'), n2=$('egmmPinNew2');
    if(o) o.value=''; if(n1) n1.value=''; if(n2) n2.value='';
    if(egmmPinOv) egmmPinOv.classList.add('show');
    setTimeout(()=>{ if(o) o.focus(); }, 80);
  };
  const closeEgmmPin = () => { if(egmmPinOv) egmmPinOv.classList.remove('show'); };
  const saveEgmmPin = async () => {
    var msg=$('egmmPinMsg');
    var oldv=($('egmmPinOld')&&$('egmmPinOld').value||'').trim();
    var a=($('egmmPinNew')&&$('egmmPinNew').value||'').trim();
    var b=($('egmmPinNew2')&&$('egmmPinNew2').value||'').trim();
    var fail=function(t){ if(msg){ msg.style.color='#b04141'; msg.textContent=t; } };
    if(!(await verifyPin(oldv))){ fail('현재 PIN이 올바르지 않습니다'); return; }
    if(!/^[0-9]{4,8}$/.test(a)){ fail('새 PIN은 숫자 4~8자리'); return; }
    if(a!==b){ fail('새 PIN이 일치하지 않습니다'); return; }
    if(!window.firebaseFns || !window.firebaseDb){ fail('연결 준비 중 — 잠시 후 다시'); return; }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));

  // 로그인한 계정이 사용 가능한지 확인 (관리자 / 승인됨만 허용, 미등록·대기·거절·삭제는 차단)
  async function checkApproval(user) {
    if ((user.email || '').toLowerCase() === ADMIN_EMAIL) {
      return { allowed: true, admin: true };
    }
    try {
      const ref = window.firebaseFns.doc(window.firebaseDb, 'registrations', user.uid);
      const snap = await window.firebaseFns.getDoc(ref);
      if (!snap.exists()) return { allowed: false, admin: false, status: 'none' }; // 미등록/삭제됨 → 차단
      const status = snap.data().status;
      if (status === 'approved') return { allowed: true, admin: false };
      return { allowed: false, admin: false, status: status || 'pending' };
    } catch (e) {
      // 문서 읽기 자체가 실패(네트워크/일시 오류)하면 잠금 방지를 위해 허용
      return { allowed: true, admin: false };
    }
  }

  // 관리자 메뉴: 전체 가입자 목록(상태 포함) 표시 + 승인/거절/삭제
  const STATUS_LABEL = { pending: '승인 대기', approved: '승인됨', rejected: '거절됨' };
  const STATUS_ORDER = { pending: 0, rejected: 1, approved: 2 };

  async function refreshAdminPanel() {
    const panel = $('adminPanel');
    if (!panel) return;
    if (!isAdmin) { panel.style.display = 'none'; panel.innerHTML = ''; return; }
    panel.style.display = 'block';
    try {
      const snap = await window.firebaseFns.getDocs(
        window.firebaseFns.collection(window.firebaseDb, 'registrations')
      );
      const list = [];
      snap.forEach(d => {
        const data = d.data() || {};
        list.push({ uid: d.id, email: data.email || '(이메일 없음)', status: data.status || 'pending' });
      });
      list.sort((a, b) => {
        const o = (STATUS_ORDER[a.status] ?? 9) - (STATUS_ORDER[b.status] ?? 9);
        return o !== 0 ? o : a.email.localeCompare(b.email);
      });

      const pendingCount = list.filter(p => p.status === 'pending').length;
      let html = `<div class="admin-title">가입자 목록 (총 ${list.length}명`
        + (pendingCount ? ` · 승인 대기 ${pendingCount}명` : '') + `)</div>`;

      if (list.length === 0) {
        html += '<div class="admin-empty">아직 가입자가 없습니다.</div>';
      } else {
        list.forEach(p => {
          const st = p.status;
          html += `<div class="admin-row">`
            + `<span class="admin-info">`
            + `<span class="admin-email">${escapeHtml(p.email)}</span>`
            + `<span class="admin-badge ${st}">${STATUS_LABEL[st] || st}</span>`
            + `</span>`
            + `<span class="admin-acts">`
            + (st !== 'approved' ? `<button class="admin-approve" data-uid="${p.uid}">승인</button>` : '')
            + (st !== 'rejected' ? `<button class="admin-reject" data-uid="${p.uid}">거절</button>` : '')
            + `<button class="admin-delete" data-uid="${p.uid}" data-email="${escapeHtml(p.email)}">삭제</button>`
            + `</span></div>`;
        });
      }
      panel.innerHTML = html;
      panel.querySelectorAll('.admin-approve').forEach(b => b.onclick = () => setRegStatus(b.dataset.uid, 'approved'));
      panel.querySelectorAll('.admin-reject').forEach(b => b.onclick = () => setRegStatus(b.dataset.uid, 'rejected'));
      panel.querySelectorAll('.admin-delete').forEach(b => b.onclick = () => deleteReg(b.dataset.uid, b.dataset.email));
    } catch (e) {
      panel.innerHTML = '<div class="admin-title">가입자 목록을 불러올 수 없습니다. (Firebase 보안 규칙 설정이 필요합니다)</div>';
    }
  }

  function getFirebaseErrorMessage(err) {
    const code = err.code || '';
    if (code.includes('email-already-in-use')) return '이미 사용 중인 이메일입니다';
    if (code.includes('invalid-email')) return '이메일 형식이 올바르지 않습니다';
    if (code.includes('weak-password')) return '비밀번호는 6자 이상이어야 합니다';
    if (code.includes('user-not-found') || code.includes('invalid-credential') || code.includes('wrong-password')) return '이메일 또는 비밀번호가 틀렸습니다';
    if (code.includes('too-many-requests')) return '너무 많이 시도했어요. 잠시 후 다시 시도해주세요';
    if (code.includes('network-request-failed')) return '인터넷 연결을 확인해주세요';
    return err.message || '오류가 발생했습니다';
  }

    if (!firebaseReady) {

  // ========== AUTH STATE CHANGE (자동 로그인 처리) ==========
  function initFirebaseAuth() {
    firebaseReady = true;
    window.firebaseFns.onAuthStateChanged(window.firebaseAuth, async (user) => {
      if (signingUp) return; // 가입 처리 중에는 자동 입장 방지
      if (user) {
        const res = await checkApproval(user);
        if (!res.allowed) {
          // 승인되지 않은 계정 → 로그인 차단
          try { await window.firebaseFns.signOut(window.firebaseAuth); } catch (e) {}
          currentUser = null;
          isAdmin = false;
          state.mode = null;
          lockErr.textContent = (res.status === 'pending')
            ? '관리자 승인 대기 중입니다.'
            : '승인되지 않은 계정입니다. 관리자에게 문의하세요.';
          return;
        }
        // MANAGER 로그인 성공 → THE SHAWN 앱으로
        currentUser = user;
        isAdmin = res.admin;
        window.location.href = 'shawn.html';
      } else {
        // 로그아웃 상태
        currentUser = null;
        isAdmin = false;
      }
    });
  }

  // ========== CALENDAR ==========
  // 특정 날짜 셀에 표시할 이벤트 목록을 반환 (생일 반복 + 다일 일정 포함)
  function getEventsForCell(cellYear, cellMonth, cellDay) {
    const key = dateKey(cellYear, cellMonth, cellDay);
    const list = [];

    state.events.forEach(e => {
      if (e.isBirthday) {
        // 생일: 매년 같은 날짜에 표시
        const { y: origY, m: origM, d: origD } = parseDateKey(e.date);
        let target;
        if (e.isLunar) {
          target = lunarBirthdayToSolarDate(origM + 1, origD, cellYear);
          if (target) target = { month: target.month - 1, day: target.day };
        } else {
          target = { month: origM, day: origD };
        }
        if (target && target.month === cellMonth && target.day === cellDay) {
          list.push({ ...e, _multiPos: null });
        }
      } else if (e.endDate && e.endDate > e.date) {
        // 다일 일정: 시작일~종료일 사이면 표시
        if (key >= e.date && key <= e.endDate) {
          let pos = 'mid';
          if (key === e.date) pos = 'start';
          else if (key === e.endDate) pos = 'end';
          list.push({ ...e, _multiPos: pos });
        }
      } else {
        // 일반 일정: 정확한 날짜 매칭
        if (e.date === key) list.push({ ...e, _multiPos: null });
      }
    });

    // 생일은 위로, 그 다음 시작 시간순
    list.sort((a, b) => {
      if (a.isBirthday && !b.isBirthday) return -1;
      if (!a.isBirthday && b.isBirthday) return 1;
      return (a.start || '99:99').localeCompare(b.start || '99:99');
    });
    return list;
  }

  function renderCalendar() {
    const y = state.viewYear, m = state.viewMonth;
    $('calMonth').innerHTML = `${MONTH_NAMES[m]} <em>${y}</em>`;

    const firstDay = new Date(y, m, 1);
    const lastDay = new Date(y, m+1, 0);
    const startWeekday = firstDay.getDay();
    const daysInMonth = lastDay.getDate();
    const prevMonthLastDay = new Date(y, m, 0).getDate();

    const tKey = todayKey();
    const cells = [];

    for (let i = startWeekday - 1; i >= 0; i--) {
      const d = prevMonthLastDay - i;
      const pm = new Date(y, m-1, d);
      cells.push({ y: pm.getFullYear(), m: pm.getMonth(), d, outside: true });
    }
    for (let d = 1; d <= daysInMonth; d++) {
      cells.push({ y, m, d, outside: false });
    }
    while (cells.length < 42) {
      const idx = cells.length - (startWeekday + daysInMonth) + 1;
      const nm = new Date(y, m+1, idx);
      cells.push({ y: nm.getFullYear(), m: nm.getMonth(), d: nm.getDate(), outside: true });
    }

    calendarEl.innerHTML = cells.map(c => {
      const key = dateKey(c.y, c.m, c.d);
      const weekday = new Date(c.y, c.m, c.d).getDay();
      const dayEvents = getEventsForCell(c.y, c.m, c.d);

      const classes = ['day'];
      if (c.outside) classes.push('outside');
      if (key === tKey) classes.push('today');
      if (key === state.selectedDate) classes.push('selected');
      if (weekday === 0) classes.push('sun');
      if (weekday === 6) classes.push('sat');

      const maxShow = 3;
      const shown = dayEvents.slice(0, maxShow);
      const remain = dayEvents.length - shown.length;

      const pillsHtml = shown.map(e => {
        const cat = e.category ? 'cat-' + e.category : '';
        const color = (e.color && e.color !== 'default') ? 'color-' + e.color : '';
        const multi = e._multiPos ? 'multi-' + e._multiPos : '';
        const classes = [cat, color, multi, e.done ? 'done' : ''].filter(Boolean).join(' ');

        if (e.isBirthday) {
          const lunarMark = e.isLunar ? '🌙 ' : '';
          return `<div class="ev-pill ${classes}">${lunarMark}${escapeHtml(e.title)}</div>`;
        }
        // 다일 일정은 시작일에만 시간 표시, 중간/끝은 제목만
        const showTime = e._multiPos === 'start' || !e._multiPos;
        const showTitle = e._multiPos !== 'mid'; // 중간일에는 제목만 (혹은 비움)
        return `<div class="ev-pill ${classes}">${(showTime && e.start) ? `<span class="ev-time">${e.start}</span>` : ''}${showTitle ? escapeHtml(e.title) : ''}</div>`;
      }).join('');

      const moreHtml = remain > 0 ? `<div class="ev-more">+${remain} more</div>` : '';

      return `
        <div class="${classes.join(' ')}" data-key="${key}">
          <div class="day-num">${c.d}</div>
          <div class="events">${pillsHtml}${moreHtml}</div>
        </div>`;
    }).join('');

    // 미니 달력도 같이 렌더링
    renderMiniCalendars();
  }

  // 이전/다음 달의 미니 달력 렌더링
  function renderMiniCalendars() {
    const y = state.viewYear, m = state.viewMonth;
    // 이전 달
    let prevY = y, prevM = m - 1;
    if (prevM < 0) { prevM = 11; prevY--; }
    // 다음 달
    let nextY = y, nextM = m + 1;
    if (nextM > 11) { nextM = 0; nextY++; }

    $('miniPrevTitle').textContent = `${MONTH_NAMES_SHORT[prevM]} ${prevY}`;
    $('miniNextTitle').textContent = `${MONTH_NAMES_SHORT[nextM]} ${nextY}`;
    $('miniPrevGrid').innerHTML = buildMiniGrid(prevY, prevM);
    $('miniNextGrid').innerHTML = buildMiniGrid(nextY, nextM);

    // 이번 달 일정 요약
    renderMonthSummary(y, m);
  }

  // 현재 보고 있는 달의 일정 요약
  function renderMonthSummary(y, m) {
    $('monthSummaryTitle').textContent = `${MONTH_NAMES_SHORT[m]} ${y} 일정`;
    const list = $('monthSummaryList');

    // 그 달의 모든 일정 수집 (날짜별로, 정렬)
    const items = [];
    const daysInMonth = new Date(y, m + 1, 0).getDate();
    for (let d = 1; d <= daysInMonth; d++) {
      const events = getEventsForCell(y, m, d);
      events.forEach(ev => {
        // 다일 일정은 시작일에만 표시
        if (ev._multiPos && ev._multiPos !== 'start') return;
        items.push({ day: d, ev });
      });
    }

    if (items.length === 0) {
      list.innerHTML = `<div class="summary-empty">이 달에 일정이 없습니다</div>`;
      return;
    }

    list.innerHTML = items.map(({ day, ev }) => {
      const cat = ev.category || 'work';
      const weekday = new Date(y, m, day).getDay();
      const dayNameKo = ['일','월','화','수','목','금','토'][weekday];

      let timeInfo = '';
      if (ev.isBirthday) {
        timeInfo = ev.isLunar ? '🌙 음력' : '🎂 양력';
      } else if (ev.endDate && ev.endDate > ev.date) {
        const endShort = formatDateShort(ev.endDate);
        timeInfo = `→ ${endShort}${ev.end ? ' ' + ev.end : ''}`;
      } else if (ev.start && ev.end) {
        timeInfo = `${ev.start} – ${ev.end}`;
      } else if (ev.start) {
        timeInfo = ev.start;
      }

      return `
        <div class="summary-item cat-${cat}" data-key="${dateKey(y, m, day)}">
          <div class="summary-date">
            <span class="sd-day">${day}</span>
            ${dayNameKo}
          </div>
          <div class="summary-body">
            <div class="summary-title-text">${escapeHtml(ev.title)}</div>
            ${timeInfo ? `<div class="summary-time">${timeInfo}</div>` : ''}
          </div>
        </div>`;
    }).join('');
  }

  function buildMiniGrid(y, m) {
    const firstWeekday = new Date(y, m, 1).getDay();
    const daysInMonth = new Date(y, m + 1, 0).getDate();
    const tKey = todayKey();

    // 하나의 grid에 요일헤더 + 날짜를 모두 넣음
    let html = '';
    // 요일 헤더 (첫 줄)
    html += '<div class="mini-weekday sun">S</div>';
    html += '<div class="mini-weekday">M</div>';
    html += '<div class="mini-weekday">T</div>';
    html += '<div class="mini-weekday">W</div>';
    html += '<div class="mini-weekday">T</div>';
    html += '<div class="mini-weekday">F</div>';
    html += '<div class="mini-weekday sat">S</div>';

    // 빈 칸 (첫째 주 시작 전)
    for (let i = 0; i < firstWeekday; i++) {
      html += '<div class="mini-day mini-empty"></div>';
    }
    // 날짜
    for (let d = 1; d <= daysInMonth; d++) {
      const key = dateKey(y, m, d);
      const weekday = new Date(y, m, d).getDay();
      const hasEvent = getEventsForCell(y, m, d).length > 0;
      const classes = ['mini-day'];
      if (weekday === 0) classes.push('mini-sun');
      if (weekday === 6) classes.push('mini-sat');
      if (key === tKey) classes.push('mini-today');
      if (hasEvent) classes.push('mini-has-event');
      html += `<div class="${classes.join(' ')}" data-key="${key}">${d}</div>`;
    }
    return html;
  }

  function renderDayEvents() {
    const key = state.selectedDate;
    if (!key) return;
    const { y: selY, m: selM, d: selD } = parseDateKey(key);
    const dayEvents = getEventsForCell(selY, selM, selD);
    $('panelCount').textContent = dayEvents.length;

    const listEl = $('evList');
    if (dayEvents.length === 0) {
      listEl.innerHTML = `<div class="empty-day">아직 등록된 일정이 없습니다</div>`;
      return;
    }

    listEl.innerHTML = dayEvents.map(ev => {
      const cat = ev.category || 'work';
      const catLabel = cat === 'work' ? '회사' : cat === 'personal' ? '개인' : '생일';
      const colorCls = (ev.color && ev.color !== 'default') ? 'color-' + ev.color : '';
      let timeLabel;
      if (ev.isBirthday) {
        const { y: by, m: bm, d: bd } = parseDateKey(ev.date);
        const thisYear = new Date().getFullYear();
        if (ev.isLunar) {
          // 음력 생일: 올해 양력 날짜 변환
          const solar = lunarBirthdayToSolarDate(bm + 1, bd, thisYear);
          if (solar) {
            timeLabel = `🌙 음력 ${bm+1}/${bd} (양력 ${solar.month}/${solar.day})`;
          } else {
            timeLabel = `🌙 음력 ${bm+1}/${bd}`;
          }
        } else {
          // 양력 생일: 음력 날짜 변환
          const lunar = solarToLunar(thisYear, bm + 1, bd);
          if (lunar) {
            timeLabel = `🎂 양력 ${bm+1}/${bd} (음력 ${lunar.month}/${lunar.day})`;
          } else {
            timeLabel = `🎂 양력 ${bm+1}/${bd}`;
          }
        }
      } else if (ev.endDate && ev.endDate > ev.date) {
        // 다일 일정
        const startStr = formatDateShort(ev.date);
        const endStr = formatDateShort(ev.endDate);
        const startTime = ev.start ? ` ${ev.start}` : '';
        const endTime = ev.end ? ` ${ev.end}` : '';
        timeLabel = `${startStr}${startTime} → ${endStr}${endTime}`;
      } else if (ev.start && ev.end) {
        timeLabel = `${ev.start} – ${ev.end}`;
      } else if (ev.start) {
        timeLabel = ev.start;
      } else {
        timeLabel = '종일';
      }

      return `
        <li class="ev-row cat-${cat} ${colorCls} ${ev.done ? 'done' : ''}" data-id="${ev.id}">
          <div class="ev-check" data-action="toggle" title="${ev.done ? '미완료로 표시' : '완료(X) 표시'}"></div>
          <div class="ev-body">
            <div class="ev-time-label">${timeLabel}<span class="ev-cat-tag cat-${cat}">${catLabel}</span></div>
            <div class="ev-title-text">${escapeHtml(ev.title)}</div>
            ${ev.notes ? `<div class="ev-notes">${escapeHtml(ev.notes)}</div>` : ''}
          </div>
          <button class="ev-del" data-action="delete" title="삭제">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="3 6 5 6 21 6"/>
              <path d="M19 6l-2 14a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2L5 6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
            </svg>
          </button>
        </li>`;
    }).join('');
  }

  function formatDateShort(key) {
    const [y, m, d] = key.split('-').map(Number);

  $('evList').addEventListener('click', e => {

        renderDayEvents();

  // 시/분 입력 → "HH:MM" 문자열로 변환
  function buildTime(hInput, mInput) {
    const h = hInput.value.trim();
    const m = mInput.value.trim();
    if (!h && !m) return null;
    const hh = parseInt(h || '0');
    const mm = parseInt(m || '0');
    if (isNaN(hh) || hh < 0 || hh > 23) return 'INVALID';
    if (isNaN(mm) || mm < 0 || mm > 59) return 'INVALID';
    return pad(hh) + ':' + pad(mm);
  }

  function addEvent() {
    const title = $('evTitle').value.trim();
    const startDate = $('evStartDate').value || state.selectedDate;
    const endDate = $('evEndDate').value || null;
    const start = buildTime($('evStartH'), $('evStartM'));
    const end = buildTime($('evEndH'), $('evEndM'));
    const notes = $('evNotes').value.trim();
    const category = formState.category;
    const color = formState.color;
    const isBirthday = category === 'birthday';
    const isLunar = isBirthday && formState.lunar === 'lunar';

    if (!title) {
      showToast('제목을 입력하세요', 'error');
      $('evTitle').focus();
      return;
    }
    if (start === 'INVALID' || end === 'INVALID') {
      showToast('시간을 0~23시, 0~59분으로 입력하세요', 'error');
      return;
    }
    if (!isBirthday && endDate && endDate < startDate) {
      showToast('종료일이 시작일보다 빠릅니다', 'error');
      return;
    }
    if (!isBirthday && !endDate && end && start && end < start) {
      showToast('종료 시간이 시작보다 빠릅니다', 'error');
      return;
    }

    const newEvent = {
      id: uid(),
      date: isBirthday ? state.selectedDate : startDate,
      endDate: isBirthday ? null : (endDate || null),
      start: isBirthday ? null : (start || null),
      end: isBirthday ? null : (end || null),
      title,
      notes: notes || null,
      done: false,
      category: category,
      color: isBirthday ? 'default' : color,
      isBirthday: isBirthday,
      isLunar: isLunar,
      created: Date.now()
    };
    state.events.push(newEvent);
    markDirty();
    // 입력 초기화
    $('evTitle').value = '';
    $('evStartDate').value = state.selectedDate;
    $('evStartH').value = '';
    $('evStartM').value = '';
    $('evEndDate').value = '';
    $('evEndH').value = '';
    $('evEndM').value = '';
    $('evNotes').value = '';
    renderDayEvents();
    renderCalendar();
    // 명확한 시각 피드백
    const msg = isBirthday ? '🎂 생일이 추가되었습니다!' : '✅ 일정이 추가되었습니다!';
    showToast(msg, 'success');
    // 추가 버튼 펄스 애니메이션
    const addBtn = $('addEvBtn');
    addBtn.classList.add('btn-flash');
    setTimeout(() => addBtn.classList.remove('btn-flash'), 600);
    $('evTitle').focus();
  }

  $('addEvBtn').onclick = addEvent;
  $('evTitle').onkeydown = e => { if (e.key === 'Enter') addEvent(); };

  // ========== NOTES ==========
  const NOTE_COLORS = ['c-yellow', 'c-pink', 'c-blue', 'c-green', 'c-purple', 'c-orange'];

  function renderNotes() {
    const grid = $('notesGrid');
    $('notesCount').textContent = state.notes.length;

    if (state.notes.length === 0) {
      grid.innerHTML = `<div class="notes-empty">아직 메모가 없어요. "+ 새 메모"를 눌러 시작하세요!</div>`;
      return;
    }

    // 최신순 정렬
    const sorted = [...state.notes].sort((a, b) => (b.updated || b.created) - (a.updated || a.created));

    grid.innerHTML = sorted.map(n => `
      <div class="note ${n.color || 'c-yellow'}" data-id="${n.id}">
        <textarea class="note-textarea" data-action="edit" placeholder="여기에 메모를 쓰세요...">${escapeHtml(n.text || '')}</textarea>
        <div class="note-footer">
          <span class="note-date">${formatNoteDate(n.updated || n.created)}</span>
          <button class="note-del" data-action="delete" title="삭제">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="3 6 5 6 21 6"/>
              <path d="M19 6l-2 14a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2L5 6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
            </svg>
          </button>
        </div>
      </div>
    `).join('');
  }

  function formatNoteDate(ts) {
    if (!ts) return '';
    const d = new Date(ts);
    const now = new Date();
    const sameDay = d.toDateString() === now.toDateString();
    if (sameDay) {
      return `${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }
    return `${d.getMonth()+1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }

  function addNote() {
    const color = NOTE_COLORS[state.notes.length % NOTE_COLORS.length];
    const newNote = {
      id: uid(),
      text: '',
      color: color,
      created: Date.now(),
      updated: Date.now()
    };
    state.notes.push(newNote);
    markDirty();
    renderNotes();
    // 새로 추가된 메모에 자동 포커스
    setTimeout(() => {
      const newEl = document.querySelector(`.note[data-id="${newNote.id}"] .note-textarea`);
      if (newEl) newEl.focus();
    }, 50);
  }

  $('addNoteBtn').onclick = addNote;

  // 메모 textarea 입력 / 삭제 처리 (이벤트 위임)
  $('notesGrid').addEventListener('input', e => {
    if (e.target.dataset.action === 'edit') {
      const noteEl = e.target.closest('.note');
      const id = noteEl.dataset.id;
      const note = state.notes.find(n => n.id === id);
      if (note) {
        note.text = e.target.value;
        note.updated = Date.now();
        markDirty();
        // 입력 중에는 전체 재렌더링 안 함 (포커스 유지)
        // 날짜만 즉시 업데이트
        const dateEl = noteEl.querySelector('.note-date');
        if (dateEl) dateEl.textContent = formatNoteDate(note.updated);
      }
    }
  });

  $('notesGrid').addEventListener('click', e => {
    const delBtn = e.target.closest('[data-action="delete"]');
    if (delBtn) {
      const noteEl = delBtn.closest('.note');
      const id = noteEl.dataset.id;
      const note = state.notes.find(n => n.id === id);
      // 내용이 있으면 확인, 없으면 바로 삭제
      const doDelete = () => {
        state.notes = state.notes.filter(n => n.id !== id);
        markDirty();
        renderNotes();
      };
      if (note && note.text && note.text.trim()) {
        showModal('메모를 삭제할까요?', '삭제한 메모는 복구할 수 없어요.', doDelete);
      } else {
        doDelete();
      }
    }
  });

  // ========== CLAUDE NOTES (작업 지침서) ==========
  const CLAUDE_NOTE_COLORS = ['yellow', 'pink', 'blue', 'green', 'purple', 'orange'];

  function escapeAttr(s) {
    return String(s || '').replace(/"/g, '&quot;').replace(/&/g, '&amp;');
  }

  function renderClaudeNotes() {
    const grid = $('claudeNotesGrid');
    if (!grid) return;
    if (!Array.isArray(state.claudeNotes)) state.claudeNotes = [];

    if (state.claudeNotes.length === 0) {
      grid.innerHTML = `
        <div class="claude-empty">
          <div class="claude-empty-icon">📝</div>
          <div class="claude-empty-text">아직 작성된 지침이 없습니다</div>
          <div class="claude-empty-sub">우측 상단 "+ 새 지침 추가" 버튼으로 시작하세요</div>
        </div>`;
      return;
    }

    // 최신 수정 순으로 정렬
    const sorted = [...state.claudeNotes].sort(
      (a, b) => (b.updated || b.created || 0) - (a.updated || a.created || 0)
    );

    grid.innerHTML = sorted.map(note => `
      <div class="claude-note color-${note.color || 'yellow'}" data-id="${note.id}">
        <input type="text" class="claude-note-title-input"
          data-action="edit-title"
          placeholder="제목을 입력하세요..."
          value="${escapeAttr(note.title || '')}">
        <textarea class="claude-note-body"
          data-action="edit-body"
          placeholder="작업 지침이나 컨텍스트를 입력하세요...

예시:
- 프로젝트: THE SHAWN
- 다음 작업: 새 기능 추가
- 주의사항: ...">${escapeHtml(note.text || '')}</textarea>
        <div class="claude-note-footer">
          <span>${note.updated ? formatNoteDate(note.updated) : ''}</span>
          <div class="claude-note-actions">
            <button class="claude-note-action" data-action="copy" title="전체 복사">📋</button>
            <button class="claude-note-action danger" data-action="delete" title="삭제">×</button>
          </div>
        </div>
      </div>
    `).join('');
  }

  function addClaudeNote() {
    if (!Array.isArray(state.claudeNotes)) state.claudeNotes = [];
    const color = CLAUDE_NOTE_COLORS[state.claudeNotes.length % CLAUDE_NOTE_COLORS.length];
    const newNote = {
      id: uid(),
      title: '',
      text: '',
      color: color,
      created: Date.now(),
      updated: Date.now()
    };
    state.claudeNotes.push(newNote);
    markDirty();
    renderClaudeNotes();
    // 새 노트 제목에 자동 포커스
    setTimeout(() => {
      const el = document.querySelector(`.claude-note[data-id="${newNote.id}"] .claude-note-title-input`);
      if (el) el.focus();
    }, 50);
  }

  $('claudeAddBtn').onclick = addClaudeNote;

  // 입력 이벤트 (제목 + 본문)
  $('claudeNotesGrid').addEventListener('input', e => {
    const action = e.target.dataset.action;
    if (action !== 'edit-title' && action !== 'edit-body') return;
    const noteEl = e.target.closest('.claude-note');
    if (!noteEl) return;
    const id = noteEl.dataset.id;
    const note = state.claudeNotes.find(n => n.id === id);
    if (!note) return;
    if (action === 'edit-title') note.title = e.target.value;
    else note.text = e.target.value;
    note.updated = Date.now();
    markDirty();
    // 날짜만 즉시 업데이트 (포커스 유지)
    const dateEl = noteEl.querySelector('.claude-note-footer span');
    if (dateEl) dateEl.textContent = formatNoteDate(note.updated);
  });

  // 클릭 이벤트 (복사, 삭제)
  $('claudeNotesGrid').addEventListener('click', async e => {
    const btn = e.target.closest('[data-action]');
    if (!btn) return;
    const action = btn.dataset.action;
    if (action !== 'copy' && action !== 'delete') return;

    const noteEl = btn.closest('.claude-note');
    if (!noteEl) return;
    const id = noteEl.dataset.id;
    const note = state.claudeNotes.find(n => n.id === id);
    if (!note) return;

    if (action === 'copy') {
      const fullText = (note.title ? note.title + '\n\n' : '') + (note.text || '');
      if (!fullText.trim()) {
        showToast('복사할 내용이 없습니다', 'error');
        return;
      }
      try {
        await navigator.clipboard.writeText(fullText);
        showToast('📋 지침이 복사되었습니다!', 'success');
      } catch (err) {
        const ta = document.createElement('textarea');
        ta.value = fullText;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        showToast('📋 지침이 복사되었습니다!', 'success');
      }
    } else if (action === 'delete') {
      const hasContent = (note.title && note.title.trim()) || (note.text && note.text.trim());
      const doDelete = () => {
        state.claudeNotes = state.claudeNotes.filter(n => n.id !== id);
        markDirty();
        renderClaudeNotes();
      };
      if (hasContent) {
        showModal('지침을 삭제할까요?', '삭제한 지침은 복구할 수 없어요.', doDelete);
      } else {
        doDelete();
      }
    }
  });

  // showClaude에서 호출하는 외부 인터페이스
  window.__claudeApp = {
    initialized: true,  // 메인 IIFE에서 이미 핸들러 등록됨
    init() {},
    render: renderClaudeNotes
  };

  // ========== CLOUD SYNC ==========
  let saveTimeout = null;
  let lastSavedAt = 0;

  function setSyncStatus(status, text) {
    // status: 'synced' | 'syncing' | 'error' | 'offline' | ''
    const els = [$('syncStatus'), $('syncStatus2')].filter(Boolean);
    els.forEach(el => {
      el.className = 'sync-status' + (status ? ' ' + status : '');
      el.textContent = text || '';
    });
  }

  async function loadFromCloud() {
    if (!currentUser) return;
    setSyncStatus('syncing', '불러오는 중...');
    try {
      const docRef = window.firebaseFns.doc(window.firebaseDb, 'users', currentUser.uid);
      const snap = await window.firebaseFns.getDoc(docRef);
      if (snap.exists()) {
        const data = snap.data();
        state.events = Array.isArray(data.events) ? data.events : [];
        state.notes = Array.isArray(data.notes) ? data.notes : [];
        state.claudeNotes = Array.isArray(data.claudeNotes) ? data.claudeNotes : [];
      } else {
        // 새 사용자
        state.events = [];
        state.notes = [];
        state.claudeNotes = [];
      }
      state.isDirty = false;
      setSyncStatus('synced', '동기화됨');
    } catch (err) {
      console.error('Cloud load error:', err);
      setSyncStatus('error', '연결 실패');
      showToast('클라우드 불러오기 실패', 'error');
    }
  }

  async function saveToCloud(immediate = false) {
    if (state.mode !== 'cloud' || !currentUser) return;
    clearTimeout(saveTimeout);
    const delay = immediate ? 0 : 800;  // debounce
    saveTimeout = setTimeout(async () => {
      setSyncStatus('syncing', '저장 중...');
      try {
        const docRef = window.firebaseFns.doc(window.firebaseDb, 'users', currentUser.uid);
        await window.firebaseFns.setDoc(docRef, {
          events: state.events,
          notes: state.notes,
          claudeNotes: state.claudeNotes || [],
          updatedAt: Date.now()
        });
        state.isDirty = false;
        lastSavedAt = Date.now();
        setSyncStatus('synced', '동기화됨');
      } catch (err) {
        console.error('Cloud save error:', err);
        setSyncStatus('error', '저장 실패');
      }
    }, delay);
  }

  // 자동 저장 트리거 - state가 바뀔 때마다 호출
  function markDirty() {
    state.isDirty = true;
    if (state.mode === 'cloud') {
      saveToCloud();
    }
  }

  // ========== SAVE ==========
  function doFileSave(password) {
    const payload = {
      version: 3,
      savedAt: new Date().toISOString(),
      events: state.events,
      notes: state.notes
    };
    const encrypted = encrypt(payload, password);
    const blob = new Blob([encrypted], { type: 'application/octet-stream' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const stamp = new Date().toISOString().slice(0,10);
    a.href = url;
    a.download = `theshawn-${stamp}.vault`;
    a.click();
    URL.revokeObjectURL(url);
    showToast('백업 파일이 다운로드되었습니다', 'success');
  }

  function saveVault() {
    if (state.mode === 'cloud') {
      showBackupModal();
    }
  }

  function showBackupModal() {
    $('modalTitle').textContent = '파일로 백업하기';
    $('modalText').innerHTML = '백업 파일을 보호할 비밀번호를 입력하세요.<br>이 비밀번호는 백업 파일을 열 때만 사용됩니다.';
    // 모달에 입력 필드 임시 삽입
    const existingInput = $('backupPwInput');
    if (existingInput) existingInput.remove();
    const input = document.createElement('input');
    input.type = 'password';
    input.id = 'backupPwInput';
    input.placeholder = '백업 비밀번호 (4자 이상)';
    input.style.cssText = 'width:100%; padding:12px 14px; margin-bottom:16px; background:var(--bg); border:1.5px solid var(--border); color:var(--text); border-radius:10px; font-family:var(--mono); font-size:15px;';
    $('modalText').after(input);

    modal.classList.add('show');
    setTimeout(() => input.focus(), 100);

    const confirmHandler = () => {
      const pw = input.value;
      if (pw.length < 4) {
        showToast('비밀번호는 4자 이상이어야 합니다', 'error');
        return;
      }
      modal.classList.remove('show');
      input.remove();
      $('modalConfirm').removeEventListener('click', confirmHandler);
      doFileSave(pw);
    };
    $('modalConfirm').addEventListener('click', confirmHandler);
    $('modalCancel').onclick = () => {
      modal.classList.remove('show');
      input.remove();
      $('modalConfirm').removeEventListener('click', confirmHandler);
    };
    input.onkeydown = e => { if (e.key === 'Enter') confirmHandler(); };
  }

  $('saveBtn').onclick = saveVault;
  $('menuSaveBtn').onclick = saveVault;

  // LOCK
  function lockNow() {
    const doLock = async () => {
      // 마지막으로 저장 시도 (immediate)
      if (state.isDirty) {
        try { await saveToCloud(true); } catch (e) {}
      }
      // 상태 초기화
      state.events = [];
      state.notes = [];
      state.claudeNotes = [];
      state.isDirty = false;
      state.selectedDate = null;
      state.mode = null;
      isAdmin = false;
      $('adminPanel').style.display = 'none';
      panelBg.classList.remove('show');
      app.classList.remove('active');
      menuScreen.classList.remove('active');
      menuScreen.classList.remove('odp-only');
      $('bibleScreen').classList.remove('active');
      $('upcScreen').classList.remove('active');
      $('caseScreen').classList.remove('active');
      $('weightScreen').classList.remove('active');
      $('calcScreen').classList.remove('active');
      $('claudeScreen').classList.remove('active');
      lockScreen.style.display = 'flex';
      setSyncStatus('', '');
      // Firebase 로그아웃
      try{ localStorage.removeItem('unifiedLogin'); }catch(e){}
      if (window.firebaseAuth && currentUser) {
        try { await window.firebaseFns.signOut(window.firebaseAuth); } catch (e) {}
      }
      setLoginMode();
    };
    doLock();
  }
  $('lockBtn').onclick = lockNow;
  $('menuLockBtn').onclick = lockNow;

  // Shortcuts
  document.addEventListener('keydown', e => {
    const isUnlocked = app.classList.contains('active') || menuScreen.classList.contains('active');
    if (!isUnlocked) return;
    if ((e.ctrlKey || e.metaKey) && e.key === 's') {
      e.preventDefault();
      saveVault();
    }
  });

  // ========== BROWSER BACK BUTTON (히스토리 연동) ==========
  // 화면 전환을 브라우저 히스토리와 연결해서, 뒤로가기를 누르면
  // 페이지를 벗어나지 않고 바로 이전 단계로 돌아가게 한다.
  //  - 기능 화면(달력/성경/UPC/대소문자/지침서)에서 뒤로가기 → 메뉴
  //  - 달력 날짜 패널이 열려 있으면 뒤로가기 → 패널만 닫기
  //  - 메뉴에서 뒤로가기 → 메뉴 유지 (화면이 사라지지 않도록)
  let __currentScreen = 'menu';

  function pushScreen(name) {
    __currentScreen = name;
    try { history.pushState({ shawnScreen: name }, ''); } catch (e) {}
  }

  function renderScreen(name) {
    if (!document.getElementById('menuScreen')) return; // THE SHAWN 앱 화면은 index에서 제거됨(shawn.html에서 처리)
    switch (name) {
      case 'todo':   showTodo();   break;
      case 'bible':  showBible();  break;
      case 'upc':    showUpc();    break;
      case 'case':   showCase();   break;
      case 'weight': showWeight(); break;
      case 'calc':   showCalc();   break;
      case 'claude': showClaude(); break;
      case 'menu':
      default:       showMenu();   break;
    }
  }

  window.addEventListener('popstate', e => {
    // 로그인(잠금) 화면 상태에서는 관여하지 않음
    if (lockScreen.style.display !== 'none') return;

    // ODP/EGMM 계열 화면은 자체 버튼으로 이동 → 뒤로가기로 페이지를 벗어나지 않게 유지
    if (state.mode === 'odp' || state.mode === 'egmm' || state.mode === 'plu' || state.mode === 'itemcode' || state.mode === 'guide') {
      try { history.pushState({ shawnScreen: state.mode }, ''); } catch (err) {}
      return;
    }

    // 날짜 패널이 열려 있으면 화면 이동 대신 패널만 닫는다
    if (panelBg.classList.contains('show')) {
      closeDayPanel();
      __currentScreen = 'todo';
      return;
    }

    const target = (e.state && e.state.shawnScreen) || '__base';

    // 메뉴 아래(베이스)로 내려가려 하면 메뉴를 다시 쌓아 메뉴에 머문다
    if (target === '__base') {
      try { history.pushState({ shawnScreen: 'menu' }, ''); } catch (err) {}
      renderScreen('menu');
      __currentScreen = 'menu';
      return;
    }

    // 그 외에는 해당 화면을 다시 그린다 (새로 push 하지 않음)
    renderScreen(target);
    __currentScreen = target;
  });

  // Init
  setLoginMode();
  setTimeout(() => $('loginEmail').focus(), 200);

})();
</script>


<script src="BIBLE-KOREAN-RKV.js"></script>
<script>
// === BIBLE DATA (개역개정 - Korean Revised Version) ===

// === BIBLE FINDER APP ===
(function(){
  'use strict';
  const $ = id => document.getElementById(id);
  const data = window.__bibleData;
  const books = data.books;

  const app = {
    initialized: false,
    currentBookIdx: 0,
    currentChapter: 1,
    highlightVerses: [], // 강조할 절 번호들

    init() {
      if (this.initialized) return;
      this.initialized = true;
      this.populateBookSelect();
      this.bindEvents();
    },

    populateBookSelect() {
      const sel = $('bibleBook');
      // 구약/신약 그룹화 (구약 39권, 신약 27권)
      const oldTestamentEnd = 39;
      const oldGroup = document.createElement('optgroup');
      oldGroup.label = '구약 (39권)';
      const newGroup = document.createElement('optgroup');
      newGroup.label = '신약 (27권)';
      books.forEach((b, idx) => {
        const opt = document.createElement('option');
        opt.value = idx;
        opt.textContent = `${b.n} (${b.s})`;
        if (idx < oldTestamentEnd) oldGroup.appendChild(opt);
        else newGroup.appendChild(opt);
      });
      sel.appendChild(oldGroup);
      sel.appendChild(newGroup);
    },

    bindEvents() {
      $('bibleGoBtn').onclick = () => this.search();
      $('bibleChapter').onkeydown = e => { if (e.key === 'Enter') this.search(); };
      $('bibleVerse').onkeydown = e => { if (e.key === 'Enter') this.search(); };
      $('bibleBook').onchange = () => {
        // 책 바꾸면 장 1로 리셋
        $('bibleChapter').value = '1';
        $('bibleVerse').value = '';
      };

      // 빠른 찾기 버튼
      document.querySelectorAll('.bible-quick-btn').forEach(btn => {
        btn.onclick = () => {
          const [bookName, chapter, verses] = btn.dataset.quick.split('|');
          const bookIdx = books.findIndex(b => b.n === bookName);
          if (bookIdx < 0) return;
          $('bibleBook').value = bookIdx;
          $('bibleChapter').value = chapter;
          $('bibleVerse').value = verses || '';
          this.search();
        };
      });

      // 장 이동 버튼
      $('biblePrevBtn').onclick = () => this.changeChapter(-1);
      $('bibleNextBtn').onclick = () => this.changeChapter(1);

      // 절 복사 버튼 (이벤트 위임)
      $('bibleResult').addEventListener('click', e => {
        const btn = e.target.closest('.verse-copy-btn');
        if (!btn) return;
        const text = btn.dataset.copy;
        this.copyToClipboard(text, btn);
      });
    },

    async copyToClipboard(text, btn) {
      try {
        // 모던 API 시도
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(text);
        } else {
          // 폴백: textarea로 복사
          const ta = document.createElement('textarea');
          ta.value = text;
          ta.style.position = 'fixed';
          ta.style.opacity = '0';
          document.body.appendChild(ta);
          ta.focus();
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
        }
        // 성공 표시: 체크 아이콘으로 1.5초간 변경
        const originalHtml = btn.innerHTML;
        btn.classList.add('copied');
        btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`;
        setTimeout(() => {
          btn.classList.remove('copied');
          btn.innerHTML = originalHtml;
        }, 1500);
      } catch (err) {
        console.error('복사 실패:', err);
        if (window.__bibleToast) window.__bibleToast('복사에 실패했어요');
      }
    },

    parseVerseInput(input) {
      // "16" → [16]
      // "16-18" → [16, 17, 18]
      // "1,3,5" → [1, 3, 5]
      // "" → [] (전체)
      if (!input || !input.trim()) return [];
      const result = [];
      input.split(',').forEach(part => {
        part = part.trim();
        if (part.includes('-')) {
          const [s, e] = part.split('-').map(n => parseInt(n.trim()));
          if (!isNaN(s) && !isNaN(e)) {
            for (let i = s; i <= e; i++) result.push(i);
          }
        } else {
          const n = parseInt(part);
          if (!isNaN(n)) result.push(n);
        }
      });
      return result;
    },

    search() {
      const bookIdx = parseInt($('bibleBook').value);
      const chapter = parseInt($('bibleChapter').value);
      const verseInput = $('bibleVerse').value;

      if (isNaN(bookIdx) || bookIdx < 0 || bookIdx >= books.length) {
        this.showError('책을 선택해주세요');
        return;
      }
      if (isNaN(chapter) || chapter < 1) {
        this.showError('장을 입력해주세요');
        return;
      }
      const book = books[bookIdx];
      if (chapter > book.c.length) {
        this.showError(`${book.n}는 ${book.c.length}장까지 있어요`);
        return;
      }

      this.currentBookIdx = bookIdx;
      this.currentChapter = chapter;
      this.highlightVerses = this.parseVerseInput(verseInput);
      this.render();
    },

    render() {
      const book = books[this.currentBookIdx];
      const chapter = this.currentChapter;
      const verses = book.c[chapter - 1]; // 배열 (0-indexed)

      // 강조 절이 있으면 그것만, 없으면 장 전체
      const showAll = this.highlightVerses.length === 0;
      const verseSet = new Set(this.highlightVerses);

      const versesHtml = verses.map((text, idx) => {
        const vNum = idx + 1;
        if (!text) return '';
        if (!showAll && !verseSet.has(vNum)) return '';
        const cls = (!showAll && verseSet.has(vNum)) ? 'bible-verse highlight' : 'bible-verse';
        const copyBtn = `<button class="verse-copy-btn" data-copy="${escapeHtml(text)}" title="복사하기">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
          </svg>
        </button>`;
        return `<div class="${cls}"><span class="bible-verse-num">${vNum}</span>${escapeHtml(text)}${copyBtn}</div>`;
      }).join('');

      const refText = this.highlightVerses.length > 0
        ? `${book.n} ${chapter}<em>:${this.formatVerseRange(this.highlightVerses)}</em>`
        : `${book.n} <em>${chapter}장</em>`;

      $('bibleResult').innerHTML = `
        <div class="bible-result-header">
          <div class="bible-ref">${refText}</div>
          <span class="bible-version-tag">개역개정</span>
        </div>
        <div class="bible-verses">${versesHtml || '<div style="color:var(--text-faint);text-align:center;padding:40px;">해당 절을 찾을 수 없어요</div>'}</div>
      `;

      // 장 이동 네비 표시
      $('bibleNav').style.display = 'flex';
      $('biblePrevBtn').disabled = (this.currentBookIdx === 0 && this.currentChapter === 1);
      const isLastBook = this.currentBookIdx === books.length - 1;
      const isLastChapter = this.currentChapter === book.c.length;
      $('bibleNextBtn').disabled = (isLastBook && isLastChapter);
      $('bibleNavInfo').textContent = `${book.n} ${chapter}/${book.c.length}장`;

      window.scrollTo({ top: 0, behavior: 'smooth' });
    },

    formatVerseRange(arr) {
      if (arr.length === 0) return '';
      if (arr.length === 1) return arr[0];
      // 연속된 범위 감지
      const sorted = [...arr].sort((a, b) => a - b);
      const min = sorted[0], max = sorted[sorted.length - 1];
      if (max - min === sorted.length - 1) return `${min}-${max}`;
      return sorted.join(',');
    },

    changeChapter(delta) {
      const book = books[this.currentBookIdx];
      let newChapter = this.currentChapter + delta;
      let newBookIdx = this.currentBookIdx;
      if (newChapter < 1) {
        newBookIdx--;
        if (newBookIdx < 0) return;
        newChapter = books[newBookIdx].c.length;
      } else if (newChapter > book.c.length) {
        newBookIdx++;
        if (newBookIdx >= books.length) return;
        newChapter = 1;
      }
      this.currentBookIdx = newBookIdx;
      this.currentChapter = newChapter;
      this.highlightVerses = [];
      $('bibleBook').value = newBookIdx;
      $('bibleChapter').value = newChapter;
      $('bibleVerse').value = '';
      this.render();
    },

    showError(msg) {
      $('bibleResult').innerHTML = `
        <div class="bible-empty">
          <div class="bible-empty-icon">⚠️</div>
          <div class="bible-empty-text" style="color:var(--danger);">${escapeHtml(msg)}</div>
        </div>
      `;
      $('bibleNav').style.display = 'none';
    }
  };

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
  }

  window.__bibleApp = app;
})();
</script>
