<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DEPARTMENT · 부서 관리</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
<style>
  :root{
    --bg:#EDEAE3; --bg-elev:#FFFDFA; --bg-elev-2:#F7F4ED;
    --border:#E4DFD4; --border-bright:#D6CFC0;
    --text:#1E1B16; --text-dim:#4C463C; --text-faint:#8C8578;
    --accent-soft:#E9EFEA; --accent-warm:#2F5D46;
    --danger:#9C3327; --danger-soft:#F5EAE7; --success:#2a8a4a;
    --mono:'Pretendard','Malgun Gothic','맑은 고딕',system-ui,sans-serif;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ background:var(--bg); color:var(--text); font-family:var(--mono); min-height:100vh; }
  .wrap{ max-width:900px; margin:0 auto; padding:20px 20px 60px; }
  .page-topbar{ display:flex; align-items:center; gap:12px; padding-bottom:14px; border-bottom:1px solid var(--border); margin-bottom:16px; }
  .page-topbar h1{ font-size:22px; font-weight:800; }
  .page-topbar h1 small{ display:block; font-size:11px; font-weight:800; letter-spacing:.16em; color:var(--text-faint); margin-top:3px; text-transform:uppercase; }
  .live{ margin-left:auto; font-size:11px; font-weight:800; color:#2f7d32; letter-spacing:.1em; }
  .banner{ display:none; background:#fdf3e2; border:1.5px solid #e0b25a; color:#7a5a12; border-radius:12px; padding:12px 16px; font-size:13px; font-weight:700; margin-bottom:14px; line-height:1.6; }
  .banner.show{ display:block; }
  .banner code{ background:#fff; border:1px solid #e0b25a; border-radius:6px; padding:1px 6px; font-weight:800; }

  .panel{ background:var(--bg-elev); border:1.5px solid var(--border); border-radius:16px; padding:16px; margin-bottom:16px; }
  .panel h2{ font-size:15px; font-weight:800; display:flex; align-items:center; gap:8px; padding-bottom:10px; border-bottom:1px solid var(--border); margin-bottom:12px; }
  .panel h2 .ico{ width:28px; height:28px; border-radius:9px; display:flex; align-items:center; justify-content:center; font-size:15px; background:#d9f5ec; }
  .panel h2 .cnt{ margin-left:auto; font-size:11px; font-weight:800; color:var(--text-faint); }

  .addgrid{ display:grid; grid-template-columns:1fr 1fr 1.2fr auto; gap:8px; align-items:end; }
  .field label{ display:block; font-size:12px; font-weight:800; color:var(--text-dim); margin-bottom:5px; }
  .field input{ width:100%; border:1.5px solid var(--border); border-radius:10px; padding:11px 13px; font:inherit; font-size:14px; font-weight:700; background:var(--bg); }
  .field input:focus{ outline:none; border-color:var(--accent-warm); background:#fff; }
  #dName, #dCode{ text-transform:uppercase; }
  .hint{ font-size:11px; color:var(--text-faint); font-weight:600; margin-top:8px; line-height:1.5; }

  .btn{ border:none; border-radius:10px; padding:12px 18px; font:inherit; font-size:14px; font-weight:800; cursor:pointer; background:var(--accent-warm); color:#fff; transition:transform .1s; white-space:nowrap; }
  .btn:active{ transform:scale(.97); }
  .btn.ghost{ background:var(--bg-elev); color:var(--text-dim); border:1.5px solid var(--border); }
  .btn.ghost:hover{ color:var(--text); border-color:var(--border-bright); }
  .btn.danger{ background:var(--bg-elev); color:var(--danger); border:1.5px solid var(--danger); }
  .btn.danger:hover{ background:var(--danger); color:#fff; }
  .btn.sm{ padding:8px 13px; font-size:12px; }

  .dlist{ display:flex; flex-direction:column; gap:7px; }
  .drow{ display:grid; grid-template-columns:170px 1fr 1fr auto; gap:10px; align-items:center;
    border:1.5px solid var(--border); border-radius:12px; padding:11px 14px; background:var(--bg); }
  .drow.edit{ border-color:var(--accent-warm); background:var(--accent-soft); }
  .drow .dc{ font-size:14px; font-weight:800; color:var(--accent-warm); letter-spacing:.02em; word-break:break-all; }
  .drow .dn{ font-size:15px; font-weight:800; }
  .drow .dk{ font-size:13px; font-weight:700; color:var(--text-dim); }
  .drow .acts{ display:flex; gap:6px; }
  .empty{ text-align:center; color:var(--text-faint); font-size:13px; font-weight:700; padding:26px 6px; border:2px dashed var(--border); border-radius:12px; }

  .toast{ position:fixed; top:26px; left:50%; transform:translateX(-50%) translateY(-16px); background:var(--text); color:#fff;
    padding:14px 24px; border-radius:12px; font-size:15px; font-weight:800; opacity:0; pointer-events:none; transition:all .25s; z-index:9999; }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
  .toast.success{ background:var(--success); } .toast.error{ background:var(--danger); }
  .modal-bg{ position:fixed; inset:0; background:rgba(30,27,22,.45); backdrop-filter:blur(4px); z-index:500; display:none; align-items:center; justify-content:center; padding:20px; }
  .modal-bg.show{ display:flex; }
  .modal{ background:var(--bg-elev); border:1px solid var(--border-bright); border-radius:16px; padding:26px; max-width:400px; width:100%; box-shadow:0 30px 80px rgba(30,27,22,.2); }
  .modal h3{ font-size:19px; font-weight:800; margin-bottom:10px; }
  .modal h3.warn{ color:var(--danger); }
  .modal p{ color:var(--text-dim); font-size:14px; font-weight:600; line-height:1.6; margin-bottom:18px; white-space:pre-wrap; word-break:break-word; }
  .modal .macts{ display:flex; gap:8px; justify-content:flex-end; }
  .gate-note{ position:fixed; inset:0; z-index:9000; display:none; align-items:center; justify-content:center; background:var(--bg); }
  .gate-note.show{ display:flex; }
  .gate-note .gc{ background:var(--bg-elev); border:1.5px solid var(--border); border-radius:16px; padding:34px 40px; text-align:center; font-weight:800; color:var(--text-dim); line-height:1.8; }

  @media (max-width:760px){
    .addgrid{ grid-template-columns:1fr 1fr; }
    .addgrid .btn{ grid-column:1/-1; }
    .drow{ grid-template-columns:1fr auto; }
    .drow .dk{ grid-column:1/-1; }
  }
</style>
</head>
<body>
<div class="toast" id="toast"></div>
<div class="gate-note" id="gateNote"><div class="gc">🔒 EGMM 포털을 통해 접속하세요<br><span style="font-size:12px;color:var(--text-faint)">egmm.html 로그인 후 SYSTEM &gt; DEPARTMENT 메뉴</span></div></div>

<div class="wrap">
  <div class="page-topbar">
    <h1>🏬 DEPARTMENT<small>매장 부서 생성 · 코드 관리 (DEPT-XXX)</small></h1>
    <span class="live">● LIVE</span>
  </div>
  <div class="banner" id="fbBanner"></div>

  <div class="panel">
    <h2><span class="ico">＋</span> <span id="addTitle">부서 추가</span></h2>
    <div class="addgrid">
      <div class="field"><label>부서 이름 (영문)</label><input type="text" id="dName" placeholder="예: FISH" autocomplete="off"></div>
      <div class="field"><label>한글명 (선택)</label><input type="text" id="dKo" placeholder="예: 생선" autocomplete="off"></div>
      <div class="field"><label>부서 코드</label><input type="text" id="dCode" placeholder="자동: DEPT-FISH" autocomplete="off"></div>
      <button class="btn" id="dSaveBtn" type="button">＋ 추가</button>
    </div>
    <div class="hint">부서는 이름이 아닌 <b>코드</b>로 관리됩니다 — 예: FISH 부서 → <b>DEPT-FISH</b> 코드로 저장/호출.
      코드는 직급·부서·메뉴 전체에서 중복될 수 없으며, 중복 시 경고가 표시됩니다. 코드 수정은 FUNCTION-CODE 관리에서도 가능합니다.</div>
    <div style="margin-top:10px; display:none;" id="editActs">
      <button class="btn ghost sm" id="dCancelBtn" type="button">수정 취소</button>
    </div>
  </div>

  <div class="panel">
    <h2><span class="ico">🏬</span> 부서 목록 <span class="cnt" id="dCnt"></span></h2>
    <div class="dlist" id="dList"></div>
  </div>
</div>

<div class="modal-bg" id="modalBg"><div class="modal">
  <h3 id="mTitle"></h3><p id="mText"></p>
  <div class="macts"><button class="btn ghost sm" id="mCancel" type="button">취소</button><button class="btn sm" id="mOk" type="button">확인</button></div>
</div></div>

<script src="../Function-Firebase-Egmm.js"></script>
<script>
(function(){
  'use strict';
  var $=function(id){ return document.getElementById(id); };
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]; }); }

  var gated=false;
  try{ gated = sessionStorage.getItem('egmmGate')==='1' || sessionStorage.getItem('egmmAccessAuth'); }catch(e){}
  if(!gated){ $('gateNote').classList.add('show'); }

  var toastTimer;
  function toast(m,t){ var el=$('toast'); clearTimeout(toastTimer); el.textContent=m; el.className='toast show '+(t||'');
    toastTimer=setTimeout(function(){ el.className='toast '+(t||''); },2400); }

  var modalCb=null;
  function askConfirm(title,text,cb,okLabel,warn){
    $('mTitle').textContent=title; $('mTitle').className=warn?'warn':'';
    $('mText').textContent=text; $('mCancel').style.display='';
    $('mOk').textContent=okLabel||'확인'; modalCb=cb; $('modalBg').classList.add('show');
  }
  function warnPopup(title,text){
    $('mTitle').textContent=title; $('mTitle').className='warn';
    $('mText').textContent=text; $('mCancel').style.display='none';
    $('mOk').textContent='닫기'; modalCb=null; $('modalBg').classList.add('show');
  }
  $('mOk').onclick=function(){ $('modalBg').classList.remove('show'); if(modalCb){ var cb=modalCb; modalCb=null; cb(); } };
  $('mCancel').onclick=function(){ $('modalBg').classList.remove('show'); modalCb=null; };
  $('modalBg').addEventListener('click',function(e){ if(e.target===$('modalBg')){ $('modalBg').classList.remove('show'); modalCb=null; } });

  var fb=null, depts={}, menus={}, ranks=[], editingCode=null;

  function fbFail(msg){
    var b=$('fbBanner');
    b.innerHTML='⚠️ '+esc(msg)+' — <code>Function-Firebase-Egmm.js</code> 상단의 egmm-hq-it 설정(apiKey 등)을 입력한 뒤 새로고침하세요.';
    b.classList.add('show');
  }
  if(!window.EgmmFB){ fbFail('공용 Firebase 모듈을 찾을 수 없습니다'); return; }
  window.EgmmFB.ready.then(function(f){
    fb=f;
    fb.onSnapshot(fb.collection(fb.db,'DEPARTMENT'), function(snap){
      depts={}; snap.forEach(function(ds){ if(ds.id.charAt(0)==='_') return; depts[ds.id]=ds.data()||{}; });
      renderList();
    }, function(e){ console.error(e); fbFail('DEPARTMENT 실시간 연결 오류'); });
    fb.onSnapshot(fb.collection(fb.db,'MENU'), function(snap){
      menus={}; snap.forEach(function(ds){ if(ds.id.charAt(0)==='_') return; menus[ds.id]=ds.data()||{}; });
    }, function(e){ console.error(e); });
    fb.onSnapshot(fb.collection(fb.db,'ACCESS'), function(snap){
      ranks=[]; snap.forEach(function(ds){ if(ds.id==='_RANKS'){ var d=ds.data()||{}; ranks=Array.isArray(d.items)?d.items:[]; } });
    }, function(e){ console.error(e); });
  }).catch(function(){ fbFail('Firebase 설정이 비어 있습니다'); });

  function allCodes(exceptDeptCode){
    var set={};
    ranks.forEach(function(r){ if(r.code) set[String(r.code).toUpperCase()]='직급 '+r.name; });
    Object.keys(depts).forEach(function(c){ if(c!==exceptDeptCode) set[c.toUpperCase()]='부서 '+(depts[c].name||c); });
    Object.keys(menus).forEach(function(c){ set[c.toUpperCase()]='메뉴 '+(menus[c].name||c); });
    return set;
  }

  function renderList(){
    var codes=Object.keys(depts).sort();
    var html='';
    codes.forEach(function(c){
      var d=depts[c];
      html+='<div class="drow'+(c===editingCode?' edit':'')+'">'
        +'<span class="dc">'+esc(c)+'</span>'
        +'<span class="dn">'+esc(d.name||'')+'</span>'
        +'<span class="dk">'+esc(d.nameKo||'')+'</span>'
        +'<span class="acts">'
        +'<button class="btn ghost sm" data-edit="'+esc(c)+'" type="button">수정</button>'
        +'<button class="btn danger sm" data-del="'+esc(c)+'" type="button">삭제</button>'
        +'</span></div>';
    });
    $('dList').innerHTML = html || '<div class="empty">부서가 없습니다. 위에서 추가하세요.</div>';
    $('dCnt').textContent = codes.length? (codes.length+'개') : '';
    Array.prototype.forEach.call($('dList').querySelectorAll('button[data-edit]'),function(b){
      b.onclick=function(){ startEdit(b.getAttribute('data-edit')); };
    });
    Array.prototype.forEach.call($('dList').querySelectorAll('button[data-del]'),function(b){
      b.onclick=function(){ delDept(b.getAttribute('data-del')); };
    });
  }

  $('dName').addEventListener('input',function(){
    if(!$('dCode').dataset.touched){
      var v=$('dName').value.trim();
      $('dCode').value = v? ('DEPT-'+window.EgmmFB.sanitizeCode(v)) : '';
    }
  });
  $('dCode').addEventListener('input',function(){ $('dCode').dataset.touched='1'; });

  function resetAdd(){
    editingCode=null;
    $('addTitle').textContent='부서 추가';
    $('dSaveBtn').textContent='＋ 추가';
    $('dName').value=''; $('dKo').value=''; $('dCode').value='';
    delete $('dCode').dataset.touched;
    $('editActs').style.display='none';
    renderList();
  }
  function startEdit(code){
    var d=depts[code]; if(!d) return;
    editingCode=code;
    $('addTitle').textContent='부서 수정: '+code;
    $('dSaveBtn').textContent='💾 저장';
    $('dName').value=d.name||''; $('dKo').value=d.nameKo||'';
    $('dCode').value=code; $('dCode').dataset.touched='1';
    $('editActs').style.display='';
    renderList();
    window.scrollTo(0,0);
  }
  $('dCancelBtn').onclick=resetAdd;

  $('dSaveBtn').onclick=function(){
    if(!fb){ toast('연결 준비 중 — 잠시 후 다시','error'); return; }
    var name=$('dName').value.trim().toUpperCase();
    var ko=$('dKo').value.trim();
    var code=window.EgmmFB.sanitizeCode($('dCode').value || ('DEPT-'+name));
    if(!name){ toast('부서 이름을 입력하세요','error'); $('dName').focus(); return; }
    if(!code){ toast('부서 코드를 입력하세요','error'); $('dCode').focus(); return; }
    if(code.charAt(0)==='_'){ toast('사용할 수 없는 코드','error'); return; }

    var dup=allCodes(editingCode);
    if(dup[code]){ warnPopup('⚠️ 코드 중복','코드 "'+code+'" 는 이미 ['+dup[code]+'] 에서 사용 중입니다.\n다른 코드를 입력하세요.'); return; }

    var base = editingCode ? (depts[editingCode]||{}) : {};
    var data={ code:code, name:name, nameKo:ko, order:(base.order!=null?base.order:Object.keys(depts).length),
      createdAt: base.createdAt||Date.now(), updatedAt: Date.now() };

    function write(){
      fb.setDoc(fb.doc(fb.db,'DEPARTMENT',code), data).then(function(){
        if(editingCode && editingCode!==code){
          return fb.deleteDoc(fb.doc(fb.db,'DEPARTMENT',editingCode));
        }
      }).then(function(){
        toast(editingCode? '저장 완료: '+code : '부서 추가됨: '+code,'success');
        resetAdd();
      }).catch(function(e){ console.error(e); toast('저장 실패 — 권한/네트워크 확인','error'); });
    }
    if(editingCode && editingCode!==code){
      askConfirm('코드 변경','부서 코드를 "'+editingCode+'" → "'+code+'" 로 변경할까요?\n(문서가 새 코드로 이동합니다)', write, '변경');
    } else write();
  };

  function delDept(code){
    askConfirm('부서 삭제','부서 "'+(depts[code]&&depts[code].name||code)+'" ('+code+') 를 삭제할까요?',function(){
      fb.deleteDoc(fb.doc(fb.db,'DEPARTMENT',code))
        .then(function(){ toast('삭제됨: '+code,'success'); if(editingCode===code) resetAdd(); })
        .catch(function(e){ console.error(e); toast('삭제 실패 — 권한 확인','error'); });
    },'삭제',true);
  }
})();
</script>
</body>
</html>
