<!-- ============================================================================
   HMART/hmart.html — H-MART 매장 초기 화면 (2026-10-07)
   · 레이아웃: EGMM/EGMM.html 과 동일 (상단바 · 왼쪽 USER 박스 + 메뉴 카드 · 오른쪽 프레임)
   · 입장(2026-10-07): EGMM 입장 방식과 같은 화면에서 매장 선택 + 매장 PIN(STORE 관리에서 설정 · STORE/{코드}.pin 해시) → 그 매장으로 입장
     같은 탭에서는 sessionStorage.hmartGate 로 유지 · 매장을 바꾸려면 LOGOUT 후 다시 입장
   · 계정(선택): ID 로그인(FUNCTION-ACCESS-GATE.js · EGMM 과 같은 세션 egmmAccessAuth) — DAILY PURCHASE 기록/결재 등 역할이 필요할 때.
     계정의 ACCESS/{ID}.stores 에 입장한 매장이 없으면 거부
   · 메뉴 권한: MENU 컬렉션 (MENU-HMART-PLU-LIST · MENU-HMART-UPC-LIST · MENU-HMART-DAILY-PURCHASE) — EGMM 과 같은 규칙
   ========================================================================== -->
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
<style>
  :root {
    --bg: #EDEAE3; --bg-elev: #FFFDFA; --bg-elev-2: #F7F4ED;
    --border: #E4DFD4; --border-bright: #D6CFC0;
    --text: #1E1B16; --text-dim: #4C463C; --text-faint: #8C8578;
    --accent: #1E1B16; --accent-soft: #E9EFEA; --accent-warm: #2F5D46;
    --brass: #A98A55; --danger: #9C3327; --success: #2a8a4a;
    --serif: 'Pretendard', 'Malgun Gothic', '맑은 고딕', system-ui, sans-serif;
    --mono: 'Pretendard', 'Malgun Gothic', '맑은 고딕', system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); color: var(--text); font-family: var(--mono); min-height: 100vh; overflow-x: hidden; -webkit-font-smoothing: antialiased; }
  body::before { content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background-image: radial-gradient(circle at 20% 10%, rgba(169,138,85,0.06) 0%, transparent 40%), radial-gradient(circle at 80% 90%, rgba(30,27,22,0.03) 0%, transparent 40%); }

  /* ===== NIGHT 모드 (EGMM · PLU/UPC 와 같은 팔레트 · localStorage pluLocalTheme 공유) ===== */
  html[data-theme=night] { color-scheme: dark;
    --bg:#12151c; --bg-elev:#1a1f2a; --bg-elev-2:#161a23; --border:#2a3140; --border-bright:#3c4557;
    --text:#e7eaf2; --text-dim:#a3acbf; --text-faint:#6d7689; --accent:#3b62c4; --accent-soft:#222a3a; --accent-warm:#d4af6a;
    --danger:#e05b5b; --success:#3fae6a; }
  html[data-theme=night] #hmMenu { background: var(--bg); }
  html[data-theme=night] body::before { display: none; }
  html[data-theme=night] .eg-side { background: var(--bg); }
  html[data-theme=night] .eg-frame { background: var(--bg); }
  html[data-theme=night] .egmm-menu-btn:hover { background: var(--bg-elev-2); }
  html[data-theme=night] .egmm-card { box-shadow: 0 1px 0 rgba(255,255,255,.04) inset, 0 14px 44px rgba(0,0,0,.35); }
  html[data-theme=night] .egmm-menu-btn.active, html[data-theme=night] .egmm-menu-btn.active:hover { background: var(--accent-soft); }
  html[data-theme=night] .eg-topbar { box-shadow: 0 2px 14px rgba(0,0,0,.35); }

  #hmMenu { display: flex; position: fixed; inset: 0; z-index: 90; overflow: hidden; flex-direction: column;

  .eg-topbar { flex: 0 0 50px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px;

  .eg-topbar-actions { display: flex; align-items: center; gap: 10px; }
  .eg-top-exit { position: relative; display: inline-flex; align-items: center; gap: 7px; background: var(--bg-elev); border: 1px solid var(--border); color: var(--text-dim);

  .eg-main { min-height: 0; position: relative; background: var(--bg); }
  .eg-frame { width: 100%; height: 100%; border: 0; display: block; background: #fff; position: absolute; inset: 0; }
  .eg-welcome { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }

  .eg-welcome-mark { font-size: 58px; font-weight: 900; letter-spacing: .01em; color: var(--text); }

  @keyframes egmmRise { to { opacity: 1; transform: none; } }

  .egmm-card-tick { width: 6px; height: 19px; border-radius: 2px; background: var(--accent-warm); flex: 0 0 auto; }
  .egmm-card-name { font-family: var(--serif); font-weight: 800; font-size: 15px; letter-spacing: .03em; color: var(--text); }
  .egmm-menu-btn { position: relative; width: 100%; display: flex; align-items: center; gap: 10px; background: var(--bg); border: 1px solid var(--border); color: var(--text);
    padding: 7px 9px; border-radius: 8px; font-family: var(--mono); font-size: 12px; font-weight: 700; cursor: pointer; margin-bottom: 5px; text-align: left; overflow: hidden;
    transition: border-color .16s, background .16s, transform .12s, box-shadow .16s; height: 38px; box-sizing: border-box; }
  .egmm-menu-btn .mlab { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; flex: 1 1 auto; min-width: 0; }
  .egmm-menu-btn::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--accent-warm); transform: scaleY(0); transform-origin: center; transition: transform .18s ease; }

  .egmm-menu-btn:hover::before { transform: scaleY(1); }
  .egmm-menu-btn:focus-visible { outline: 2px solid var(--accent-warm); outline-offset: 2px; }
  .egmm-menu-btn:active { transform: scale(.99); }
  .egmm-menu-btn.active, .egmm-menu-btn.active:hover { border-color: #9C3327 !important; box-shadow: 0 0 0 1px #9C3327 inset; background: var(--accent-soft, #f0eee5); color: var(--text); font-weight: 800; }

  /* 접속자 박스 */

  .eg-store-sel { width: 100%; border: 1px solid var(--border); background: var(--bg-elev); color: var(--text); border-radius: 7px; padding: 4px 6px; font: inherit; font-size: 12px; font-weight: 800; }

  .eg-userbox .eg-user-btns { display: flex; gap: 5px; margin-top: 8px; }
  .eg-user-btn { flex: 1; min-width: 0; border: 1px solid var(--border); background: var(--bg-elev); color: var(--text-dim); border-radius: 9px; padding: 7px 2px; font: inherit; font-size: 10.5px; font-weight: 800; cursor: pointer; white-space: nowrap; }
  .eg-user-btn:hover { border-color: var(--accent-warm); color: var(--text); }
  .eg-user-btn.danger:hover { border-color: #9C3327; color: #9C3327; }

  /* 처음으로 확인 팝업 */
  .eg-exit-ov { position: fixed; inset: 0; z-index: 140; display: none; align-items: center; justify-content: center; background: rgba(30,27,22,.34); backdrop-filter: blur(2px); }
  .eg-exit-ov.show { display: flex; }
  .eg-exit-modal { width: 340px; background: var(--bg-elev); border: 1px solid var(--border); border-radius: 16px; padding: 22px 22px 18px; box-shadow: 0 24px 64px rgba(30,27,22,.28); text-align: center; }
  .eg-exit-title { font-weight: 900; font-size: 17px; color: var(--text); margin-bottom: 10px; }
  .eg-exit-text { font-size: 14px; color: var(--text-dim); margin-bottom: 18px; }
  .eg-exit-btns { display: flex; gap: 10px; }
  .eg-ex-btn { flex: 1; padding: 11px 0; border-radius: 10px; border: 1.5px solid var(--border); background: var(--bg); color: var(--text-dim); font-family: var(--mono); font-size: 14px; font-weight: 800; cursor: pointer; }
  .eg-ex-btn:hover { border-color: var(--accent-warm); color: var(--text); }
  .eg-ex-btn.danger { background: #b04141; border-color: #b04141; color: #fff; }
  .eg-ex-btn.danger:hover { background: #983434; border-color: #983434; color: #fff; }

  @media (max-width: 760px) { .eg-body { grid-template-columns: 170px 1fr; } }
  /* === 진입 게이트 (EGMM 과 동일 디자인 · 매장 선택 + PIN) === */
  html.hm-gate-lock body > *:not(#hmGateOv){ visibility: hidden !important; }
  #hmGateOv{ position: fixed; inset: 0; z-index: 99999; display: flex; align-items: center; justify-content: center; background: #EDEAE3; visibility: visible !important; }
  #hmGateOv .egg-card{ width: 340px; background: #FFFDFA; border: 1.5px solid #E4DFD4; border-radius: 18px; padding: 30px 30px 26px; box-shadow: 0 14px 30px -20px rgba(30,27,22,.42); }
  #hmGateOv .egg-title{ margin: 0 0 18px; font-size: 24px; font-weight: 800; letter-spacing: .16em; text-align: center; color: #1E1B16; }
  #hmGateOv .egg-field{ margin-bottom: 12px; }
  #hmGateOv .egg-field label{ display: block; font-size: 11px; font-weight: 800; letter-spacing: .08em; color: #8C8578; margin-bottom: 5px; }
  #hmGateOv .egg-field input, #hmGateOv .egg-field select{ width: 100%; box-sizing: border-box; border: 1.5px solid #E4DFD4; border-radius: 10px; padding: 12px 14px; font: inherit; font-size: 15px; font-weight: 700; color: #1E1B16; background: #FFFDFA; }
  #hmGateOv .egg-field input:focus, #hmGateOv .egg-field select:focus{ outline: none; border-color: #2F5D46; }
  #hmGateOv #hmgPin{ letter-spacing: .25em; text-align: center; }
  #hmGateOv .egg-err{ min-height: 18px; font-size: 12px; font-weight: 800; color: #9C3327; letter-spacing: .04em; margin: 2px 0 10px; text-align: center; }
  #hmGateOv .egg-btns{ display: flex; gap: 10px; }
  #hmGateOv .egg-btn{ flex: 1.4; border: none; border-radius: 10px; padding: 13px 0; font: inherit; font-size: 14px; font-weight: 800; letter-spacing: .08em; cursor: pointer; background: #2F5D46; color: #fff; }
  #hmGateOv .egg-btn.egg-cancel{ flex: 1; background: #FFFDFA; color: #1E1B16; border: 1.5px solid #D6CFC0; }
  .eg-id-btn { border: 1px solid var(--border); background: var(--bg-elev); color: var(--accent-warm); border-radius: 7px; padding: 2px 8px; font: inherit; font-size: 10.5px; font-weight: 800; cursor: pointer; }
  .eg-id-btn:hover { border-color: var(--accent-warm); }
</style>

<body>
<script src="../FUNCTION-FIREBASE-EGMM.js"></script>
<script src="../FUNCTION-ACCESS-GATE.js"></script>
<script>
  /* === 진입 게이트 === EGMM 입장 방식과 동일한 화면: 매장 선택 → 매장 PIN 입력 → 그 매장으로 입장.
     PIN 은 EGMM › STORE 관리에서 매장마다 설정 (STORE/{코드}.pin · 해시). 같은 탭 새로고침 = 입장 유지 (sessionStorage.hmartGate) */
  (function(){
    'use strict';
    var SS='hmartGate';
    document.documentElement.classList.add('hm-gate-lock');
    function unlock(st){
      var ov=document.getElementById('hmGateOv'); if(ov) ov.remove();
      document.documentElement.classList.remove('hm-gate-lock');
      window.__hmGateStore=st; try{ window.__hmStart&&window.__hmStart(st); }catch(e){ console.error(e); }
    }
    function show(){
      var ov=document.getElementById('hmGateOv');
      if(!ov){
        ov=document.createElement('div'); ov.id='hmGateOv';
        ov.innerHTML='<div class="egg-card">'
          +'<h1 class="egg-title">H-MART</h1>'
          +'<div class="egg-field"><label>STORE</label><select id="hmgStore"><option value="">매장 목록 읽는 중…</option></select></div>'
          +'<div class="egg-field"><label>PIN</label><input type="password" id="hmgPin" inputmode="numeric" placeholder="••••••" autocomplete="off"></div>'
          +'<div class="egg-err" id="hmgErr"></div>'
          +'<div class="egg-btns"><button class="egg-btn" id="hmgEnter" type="button">ENTER</button>'
          +'<button class="egg-btn egg-cancel" id="hmgCancel" type="button">CANCEL</button></div>'
        +'</div>';
        (document.body||document.documentElement).appendChild(ov);
        var sel=document.getElementById('hmgStore'), pin=document.getElementById('hmgPin'), er=document.getElementById('hmgErr');
        pin.addEventListener('input',function(){ var v=pin.value.replace(/[^0-9]/g,''); if(pin.value!==v) pin.value=v; });
        document.getElementById('hmgCancel').onclick=function(){ location.replace('../index.html'); };
        var stores={}, busy=false;
        function fill(){ var keep=sel.value; var codes=Object.keys(stores).sort(function(a,b){ return ((stores[a].order!=null?stores[a].order:999)-(stores[b].order!=null?stores[b].order:999))||a.localeCompare(b); });
          sel.innerHTML='<option value="">— 매장 선택 —</option>'+codes.map(function(c){ var d=stores[c]; return '<option value="'+c.replace(/"/g,'')+'">'+String(d.name||c).replace(/</g,'&lt;')+(d.nameKo?' · '+String(d.nameKo).replace(/</g,'&lt;'):'')+'</option>'; }).join('');
          var last=''; try{ last=localStorage.getItem('hmartLastStore')||''; }catch(e){}
          sel.value=(keep&&stores[keep])?keep:((last&&stores[last])?last:''); }
        function submit(){
          if(busy) return; er.textContent='';
          var code=sel.value, v=(pin.value||'').trim();
          if(!code){ er.textContent='SELECT STORE'; sel.focus(); return; }
          if(!v){ er.textContent='ENTER PIN'; pin.focus(); return; }
          var d=stores[code]||{};
          if(!d.pin){ er.textContent='PIN NOT SET · ASK IT-MANAGER'; return; }
          busy=true; er.textContent='CHECKING…';
          window.EgmmFB.verifyPw(d.pin, v).then(function(ok){
            busy=false;
            if(!ok){ er.textContent='WRONG PIN'; pin.value=''; pin.focus(); return; }
            var st={ code:code, name:d.name||code, nameKo:d.nameKo||'', at:Date.now() };
            try{ sessionStorage.setItem(SS, JSON.stringify(st)); }catch(e){}
            unlock(st);
          });
        }
        document.getElementById('hmgEnter').onclick=submit;
        pin.addEventListener('keydown',function(e){ if(e.key==='Enter') submit(); });
        sel.addEventListener('change',function(){ pin.focus(); });
        if(!window.EgmmFB){ er.textContent='FUNCTION-FIREBASE-EGMM.js 로드 필요'; return; }
        window.EgmmFB.ready.then(function(fb){
          return fb.getDocs(fb.collection(fb.db,'STORE')).then(function(snap){ snap.forEach(function(ds){ if(ds.id.charAt(0)!=='_') stores[ds.id]=ds.data()||{}; }); fill();
            if(!Object.keys(stores).length) er.textContent='NO STORE · EGMM › STORE 관리에서 매장을 만드세요'; });
        }).catch(function(e){ console.error(e); er.textContent='CONNECTION ERROR — TRY AGAIN'; });
      }
    }
    function start(){
      var st=null; try{ st=JSON.parse(sessionStorage.getItem(SS)||'null'); }catch(e){}
      if(st&&st.code){ unlock(st); return; }   // 같은 탭 새로고침 = 입장 유지
      show();
    }
    if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', start, {once:true}); else start();
  })();
</script>

<script>
(function(){
  'use strict';
  var $=function(id){ return document.getElementById(id); };
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]; }); }

  /* ── 메뉴 코드 (MENU 관리에 등록하면 EGMM 과 같은 규칙으로 표시/숨김 · 미등록 = 제한 없음) ── */
  var MENU_CODES={ hmPluListBtn:'MENU-HMART-PLU-LIST', hmUpcListBtn:'MENU-HMART-UPC-LIST', hmPurchaseBtn:'MENU-HMART-DAILY-PURCHASE' };
  var PAGES={ hmPluListBtn:'PLU-LIST.HTML', hmUpcListBtn:'UPC-LIST.HTML', hmPurchaseBtn:'daily-purchase.html' };
  var SS_STORE='hmartStore';

  var user=null, fb=null, cur=null;   /* cur = 입장한 매장 {code,name} · user = (선택) ID 로그인 계정 */
  var __frames={};

  /* ── NIGHT 모드 (EGMM 과 동일 · 프레임에도 적용) ── */
  var THEME_KEY='pluLocalTheme';
  function curTheme(){ try{ return localStorage.getItem(THEME_KEY)==='night'?'night':'day'; }catch(e){ return 'day'; } }
  function applyTheme(t){
    t=(t==='night')?'night':'day';
    document.documentElement.setAttribute('data-theme',t);
    var b=$('hmThemeBtn'); if(b) b.textContent=(t==='night')?'☀️ DAY':'🌙 NIGHT';
    for(var k in __frames){ try{ var d=__frames[k].contentDocument; if(d&&d.documentElement) d.documentElement.setAttribute('data-theme',t); }catch(e){} }
  }
  $('hmThemeBtn').onclick=function(){ var t=(curTheme()==='night')?'day':'night'; try{ localStorage.setItem(THEME_KEY,t); }catch(e){} applyTheme(t); };
  applyTheme(curTheme());

  /* ── 프레임 ── */
  function showWelcome(){
    for(var k in __frames){ __frames[k].style.display='none'; }
    $('hmWelcome').style.display='';
    Array.prototype.forEach.call(document.querySelectorAll('.eg-side .egmm-menu-btn'), function(b){ b.classList.remove('active'); });
    window.scrollTo(0,0);
  }
  $('hmMainBtn').onclick=showWelcome;
  function openInFrame(url, btn){
    $('hmWelcome').style.display='none';
    for(var k in __frames){ __frames[k].style.display='none'; }
    var f=__frames[url];
    if(!f){
      f=document.createElement('iframe');
      f.className='eg-frame'; f.title='content'; f.src=url; f.setAttribute('allowfullscreen',''); f.allow='fullscreen';
      f.addEventListener('load', function(){ try{ f.contentDocument.documentElement.setAttribute('data-theme', curTheme()); }catch(e){} sendStore(f); });
      document.querySelector('.eg-main').appendChild(f);
      __frames[url]=f;
    }
    f.style.display='block';
    Array.prototype.forEach.call(document.querySelectorAll('.eg-side .egmm-menu-btn'), function(b){ b.classList.remove('active'); });
    if(btn) btn.classList.add('active');
  }
  Object.keys(PAGES).forEach(function(id){ var b=$(id); if(b) b.onclick=function(){ openInFrame(PAGES[id], b); }; });

  /* 전체 화면 중계 (PLU/UPC LIST 의 FULL SCREEN · EGMM 과 동일) */
  document.addEventListener('fullscreenchange',function(){ var el=document.fullscreenElement; Array.prototype.forEach.call(document.querySelectorAll('iframe'),function(f){ try{ f.contentWindow.postMessage({plu:'fullscreenState',on:(el===f)},'*'); }catch(x){} }); });
  window.addEventListener('message',function(e){ var d=e.data||{}; if(d.plu==='fullscreen'){
      try{ var fr=null; Array.prototype.forEach.call(document.querySelectorAll('iframe'),function(f){ if(f.contentWindow===e.source) fr=f; }); if(fr&&d.on&&fr.requestFullscreen) fr.requestFullscreen(); else if(!d.on&&document.fullscreenElement) document.exitFullscreen(); }catch(x){} return; }
    if(d.plu==='syncChip'){ var v=$('hmCloudState'); v.textContent=String(d.text||''); v.className='v '+(d.cls||''); v.title=d.title||''; }
  });

  /* ── 매장 (게이트에서 PIN 으로 입장한 매장 · 프레임에 알림) ── */
  function sendStore(f){ try{ f.contentWindow.postMessage({ hmart:'store', code:cur?cur.code:'', name:cur?cur.name:'', user:user||null },'*'); }catch(e){} }
  function setStore(s){
    cur=s||null;
    try{ if(cur) sessionStorage.setItem(SS_STORE, JSON.stringify({code:cur.code,name:cur.name})); else sessionStorage.removeItem(SS_STORE); }catch(e){}
    try{ if(cur) localStorage.setItem('hmartLastStore', cur.code); }catch(e){}
    var nm=cur?(cur.name||cur.code):'—';
    $('hmTopStore').textContent=nm; $('hmWelcomeStore').textContent=cur?nm:''; $('hmStoreBox').textContent=nm;
    for(var k in __frames){ sendStore(__frames[k]); }
  }

  /* ── 접속자 박스: 매장 입장(기본) + 선택 ID 로그인(DAILY PURCHASE 기록/결재 등 역할 필요 시) ── */
  function fillUser(){
    if(!user){
      $('hmUserName').textContent=cur?(cur.name||cur.code):'—'; $('hmUserId').textContent='STORE';
      $('hmUserRank').innerHTML='매장 입장 <button class="eg-id-btn" id="hmIdLoginBtn" type="button" title="ACCESS 계정으로 로그인 (기록·결재 권한)">ID 로그인</button>';
      $('hmIdLoginBtn').onclick=idLogin; return;
    }
    $('hmUserName').textContent=user.fullName||user.id||'—'; $('hmUserId').textContent=user.id||'—';
    var perm=(Array.isArray(user.perms)&&user.perms.indexOf('*')>=0)?'ALL':((Array.isArray(user.perms)&&user.perms.length)?user.perms.length+' MENU':'');
    $('hmUserRank').textContent=[(typeof user.level==='number')?('LV-'+user.level):'',user.rank||'',perm].filter(Boolean).join(' · ')||'—';
  }
  /* 계정이 이 매장에 허용되는지 (ACCESS/{ID}.stores · 빈 값/'*'/LV-0 = 전체) */
  function acctAllowed(u, acctStores){
    if(typeof u.level==='number'&&u.level===0) return true;
    var p=Array.isArray(acctStores)?acctStores.map(function(x){ return String(x||'').trim().toUpperCase(); }).filter(Boolean):[];
    if(!p.length||p.indexOf('*')>=0) return true;
    return p.indexOf(String(cur.code).toUpperCase())>=0 || p.indexOf(String(cur.name||'').toUpperCase())>=0;
  }
  function afterAcct(u){
    return fb.getDoc(fb.doc(fb.db,'ACCESS',String(u.id||'').toUpperCase())).then(function(sn){ var d=(sn&&sn.exists&&sn.exists())?(sn.data()||{}):{}; return d.stores; }).catch(function(){ return null; })
      .then(function(st){
        if(!acctAllowed(u,st)){ try{ sessionStorage.removeItem('egmmAccessAuth'); }catch(e){} user=null; fillUser(); notice('계정 "'+u.id+'" 는 매장 '+(cur.name||cur.code)+' 에 허용되지 않았습니다. EGMM › ACCESS 관리에서 매장을 지정하세요.'); return; }
        user=u; fillUser(); applyMenuPerms();
        for(var k in __frames){ try{ __frames[k].contentWindow.postMessage({ hmart:'account', user:user },'*'); }catch(e){} }
      });
  }
  function notice(msg){ var ov=document.createElement('div'); ov.className='eg-exit-ov show';
    ov.innerHTML='<div class="eg-exit-modal"><div class="eg-exit-title">접속 불가</div><div class="eg-exit-text"></div><div class="eg-exit-btns"><button class="eg-ex-btn" type="button">확인</button></div></div>';
    ov.querySelector('.eg-exit-text').textContent=msg; ov.querySelector('button').onclick=function(){ ov.remove(); }; document.body.appendChild(ov); }
  function idLogin(){ AccessGate.require({ title:'H-MART · ID', force:true }).then(afterAcct); }
  function logoutAll(){ ['egmmGate','egmmUser','egmmAuth','egmmAccessAuth',SS_STORE,'hmartGate'].forEach(function(k){ try{ sessionStorage.removeItem(k); }catch(e){} }); location.reload(); }
  $('hmLogoutBtn').onclick=logoutAll;
  (function(){
    var ov=document.createElement('div'); ov.className='eg-exit-ov'; ov.id='hmExitOv';
    ov.innerHTML='<div class="eg-exit-modal"><div class="eg-exit-title">← 처음으로</div><div class="eg-exit-text">H-MART 를 나가고 처음 화면으로 돌아갈까요?</div><div class="eg-exit-btns"><button class="eg-ex-btn" id="hmExCancel" type="button">취소</button><button class="eg-ex-btn danger" id="hmExOk" type="button">나가기</button></div></div>';
    document.body.appendChild(ov);
    $('hmExitBtn').onclick=function(){ ov.classList.add('show'); };
    ov.addEventListener('click', function(e){ if(e.target===ov) ov.classList.remove('show'); });
    $('hmExCancel').onclick=function(){ ov.classList.remove('show'); };
    $('hmExOk').onclick=function(){ ov.classList.remove('show'); ['egmmGate','egmmAuth','egmmUser','egmmAccessAuth',SS_STORE,'hmartGate'].forEach(function(k){ try{ sessionStorage.removeItem(k); }catch(e){} }); window.location.href='../index.html'; };
  })();

  /* ── 메뉴 권한 (EGMM applyMenuPerms 와 같은 규칙) ── */
  function applyMenuPerms(){
    if(!user) return;   /* 매장 입장(계정 없음): 전체 메뉴 */
    var perms=Array.isArray(user.perms)?user.perms:[], lv=(typeof user.level==='number')?user.level:null;
    if(lv===0 || perms.indexOf('*')>=0) return;
    return fb.getDocs(fb.collection(fb.db,'MENU')).then(function(snap){
      var menus={}; snap.forEach(function(ds){ if(ds.id.charAt(0)!=='_') menus[ds.id]=ds.data()||{}; });
      Object.keys(MENU_CODES).forEach(function(btnId){
        var btn=$(btnId); if(!btn) return;
        var code=MENU_CODES[btnId], m=menus[code], ok;
        if(!m) ok=true;
        else if(m.active===false) ok=false;
        else ok = perms.indexOf(code)>=0
          || (Array.isArray(m.allowUsers) && m.allowUsers.indexOf(user.id)>=0)
          || (Array.isArray(m.allowRanks) && user.rank && m.allowRanks.indexOf(user.rank)>=0)
          || (typeof m.level==='number' && lv!==null && lv<=m.level);
        if(!ok) btn.style.display='none';
      });
    }).catch(function(e){ console.warn('[메뉴 권한 필터 실패 — 전체 표시]', e); });
  }

  /* ── 시작 (게이트 통과 · st = 입장한 매장) ── */
  window.__hmStart=function(st){
    setStore(st); user=null; fillUser();
    window.EgmmFB.ready.then(function(f){
      fb=f; $('hmCloudState').textContent='연결됨'; $('hmCloudState').className='v ok';
      /* 같은 탭에 EGMM/ACCESS 계정 세션이 있으면 그대로 사용 (이 매장에 허용된 계정만) */
      var sess=null; try{ sess=JSON.parse(sessionStorage.getItem('egmmAccessAuth')||'null'); }catch(e){}
      if(sess&&sess.id) return afterAcct(sess);
    }).catch(function(e){ console.error(e); $('hmCloudState').textContent='CLOUD 연결 실패'; $('hmCloudState').className='v err'; });
  };
  if(window.__hmGateStore) window.__hmStart(window.__hmGateStore);
})();
</script>
</body>
</html>
