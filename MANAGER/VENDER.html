<!DOCTYPE html>
<!--
  VENDER.html — 업체(벤더) 관리 · EGMM > SYSTEM
  Firestore(egmm-hq-it / DB egmm) VENDER/{축약어} = { code, name(업체명), nameKo, items(영업 품목 종류 · 쉼표 구분), aliases[](유사 이름), dept(부서 코드 · 카테고리), order, createdAt, updatedAt }
  [2026-10-07] 카테고리 = DEPARTMENT 관리의 부서 — 목록을 부서별로 묶어 부서 순서대로 표시 (2열 · 화면 전체 사용)
  축약어 = UPC MANAGER 의 VENDER 필드 값 · 불러오기에서 업체 지정 시 대분류(카테고리) 이름
  [2026-10-07] 유사 이름(aliases): 같은 업체를 파트(MEAT·GROCERY·FISH…)별로 따로 등록할 수 있으므로 업체명 중복 허용.
    대표 업체 옆에 비슷한 이름(예: EGP(GR), EGP(ASIAN), EGP GRO))을 등록하면 다른 앱에서 그 이름이 대표 업체로 인식된다
    (EgmmFB.venderMatch — 대소문자·공백·기호 무시). 유사 이름은 다른 업체와 겹칠 수 없다.
-->
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VENDER · 업체 관리</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
<style>
  :root{
    --bg:#EDEAE3; --bg-elev:#FFFDFA; --bg-elev-2:#F7F4ED;
    --border:#E4DFD4; --border-bright:#D6CFC0;
    --text:#1E1B16; --text-dim:#4C463C; --text-faint:#8C8578;
    --accent-soft:#E9EFEA; --accent-warm:#2F5D46;
    --danger:#9C3327; --danger-soft:#F5EAE7; --success:#2a8a4a;
    --mono:'Pretendard','Malgun Gothic','맑은 고딕',system-ui,sans-serif;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ background:var(--bg); color:var(--text); font-family:var(--mono); min-height:100vh; }
  .wrap{ max-width:none; margin:0; padding:16px 20px 16px; height:100vh; display:flex; flex-direction:column; }   /* 화면 가로·세로 전체 사용 */
  .panel.list{ flex:1; min-height:0; display:flex; flex-direction:column; margin-bottom:0; }
  .panel.list .dlist{ flex:1; min-height:0; overflow-y:auto; padding-right:4px; }
  .page-topbar{ display:flex; align-items:center; gap:12px; padding-bottom:14px; border-bottom:1px solid var(--border); margin-bottom:16px; }
  .page-topbar h1{ font-size:22px; font-weight:800; }
  .page-topbar h1 small{ display:block; font-size:11px; font-weight:800; letter-spacing:.16em; color:var(--text-faint); margin-top:3px; text-transform:uppercase; }
  .live{ margin-left:auto; font-size:11px; font-weight:800; color:#2f7d32; letter-spacing:.1em; }
  .banner{ display:none; background:#fdf3e2; border:1.5px solid #e0b25a; color:#7a5a12; border-radius:12px; padding:12px 16px; font-size:13px; font-weight:700; margin-bottom:14px; line-height:1.6; }
  .banner.show{ display:block; }
  .banner code{ background:#fff; border:1px solid #e0b25a; border-radius:6px; padding:1px 6px; font-weight:800; }

  .panel{ background:var(--bg-elev); border:1.5px solid var(--border); border-radius:16px; padding:16px; margin-bottom:16px; }
  .panel h2{ font-size:15px; font-weight:800; display:flex; align-items:center; gap:8px; padding-bottom:10px; border-bottom:1px solid var(--border); margin-bottom:12px; }
  .panel h2 .ico{ width:28px; height:28px; border-radius:9px; display:flex; align-items:center; justify-content:center; font-size:15px; background:#d9f5ec; }
  .panel h2 .cnt{ margin-left:auto; font-size:11px; font-weight:800; color:var(--text-faint); }

  .addgrid{ display:grid; grid-template-columns:1.2fr 1fr .9fr 1.4fr 1fr auto; gap:8px; align-items:end; }
  .field label{ display:block; font-size:12px; font-weight:800; color:var(--text-dim); margin-bottom:5px; }
  .field input{ width:100%; border:1.5px solid var(--border); border-radius:10px; padding:11px 13px; font:inherit; font-size:14px; font-weight:700; background:var(--bg); }
  .field input:focus{ outline:none; border-color:var(--accent-warm); background:#fff; }
  .field select{ width:100%; border:1.5px solid var(--border); border-radius:10px; padding:11px 13px; font:inherit; font-size:14px; font-weight:700; background:var(--bg); }
  .field select:focus{ outline:none; border-color:var(--accent-warm); background:#fff; }
  #dCode{ text-transform:uppercase; }
  .hint{ font-size:11px; color:var(--text-faint); font-weight:600; margin-top:8px; line-height:1.5; }

  .btn{ border:none; border-radius:10px; padding:12px 18px; font:inherit; font-size:14px; font-weight:800; cursor:pointer; background:var(--accent-warm); color:#fff; transition:transform .1s; white-space:nowrap; }
  .btn:active{ transform:scale(.97); }
  .btn.ghost{ background:var(--bg-elev); color:var(--text-dim); border:1.5px solid var(--border); }
  .btn.ghost:hover{ color:var(--text); border-color:var(--border-bright); }
  .btn.danger{ background:var(--bg-elev); color:var(--danger); border:1.5px solid var(--danger); }
  .btn.danger:hover{ background:var(--danger); color:#fff; }
  .btn.sm{ padding:8px 13px; font-size:12px; }

  .sortbar{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-bottom:10px; font-size:12px; font-weight:800; color:var(--text-dim); }
  .sortbar .sb{ border:1.5px solid var(--border); background:var(--bg); color:var(--text-dim); border-radius:8px; padding:6px 11px; font:inherit; font-size:12px; font-weight:800; cursor:pointer; }
  .sortbar .sb.on{ background:var(--accent-warm); border-color:var(--accent-warm); color:#fff; }
  .sortbar .sb.dir{ margin-left:4px; }
  .drow .mv{ display:flex; flex-direction:column; gap:2px; }
  .drow .mv button{ border:1px solid var(--border); background:var(--bg-elev); border-radius:6px; font:inherit; font-size:10px; font-weight:800; padding:1px 7px; cursor:pointer; color:var(--text-dim); }
  .drow .mv button:disabled{ opacity:.3; cursor:default; }
  .dlist{ display:grid; grid-template-columns:1fr 1fr; gap:7px 12px; align-content:start; }   /* 2열 */
  .dgroup{ grid-column:1/-1; display:flex; align-items:center; gap:10px; margin-top:8px; padding:6px 2px 5px; border-bottom:1.5px solid var(--border-bright); font-size:13px; font-weight:900; letter-spacing:.06em; color:var(--text); }
  .dgroup:first-child{ margin-top:2px; }
  .dgroup .gnum{ min-width:24px; height:24px; border-radius:7px; background:var(--accent-warm); color:#fff; display:inline-flex; align-items:center; justify-content:center; font-size:12px; font-weight:900; padding:0 7px; }
  .dgroup .gcnt{ margin-left:auto; font-size:11px; font-weight:800; color:var(--text-faint); }
  .dgroup.none{ color:var(--text-faint); } .dgroup.none .gnum{ background:var(--border-bright); color:var(--text-dim); }
  .drow{ display:grid; grid-template-columns:1fr auto; gap:6px 10px; align-items:center; min-width:0;
    border:1.5px solid var(--border); border-radius:12px; padding:9px 12px; background:var(--bg); }
  .drow.manual{ grid-template-columns:auto 1fr auto; }
  .drow .l1{ display:flex; align-items:baseline; gap:8px; min-width:0; flex-wrap:wrap; }
  .drow .l2{ display:flex; align-items:baseline; gap:8px; min-width:0; flex-wrap:wrap; }
  .drow .main{ min-width:0; display:flex; flex-direction:column; gap:2px; }
  .drow.edit{ border-color:var(--accent-warm); background:var(--accent-soft); }
  .drow .dc{ font-size:13px; font-weight:800; color:var(--accent-warm); letter-spacing:.02em; word-break:break-all; }
  .drow .dn{ font-size:14.5px; font-weight:800; }
  .drow .dk{ font-size:12.5px; font-weight:700; color:var(--text-dim); }
  .drow .di{ font-size:12px; font-weight:700; color:var(--text-dim); word-break:keep-all; }
  .drow .dal{ display:inline; margin:0; }
  .drow .acts{ display:flex; gap:6px; position:relative; }
  .dpop{ position:fixed; z-index:600; background:var(--bg-elev); border:1.5px solid var(--border-bright); border-radius:12px; box-shadow:0 18px 44px rgba(30,27,22,.2); padding:6px; display:none; min-width:200px; max-height:60vh; overflow-y:auto; }
  .dpop.show{ display:block; }
  .dpop button{ display:flex; align-items:center; gap:8px; width:100%; text-align:left; border:none; background:transparent; border-radius:8px; padding:8px 10px; font:inherit; font-size:13px; font-weight:800; color:var(--text); cursor:pointer; }
  .dpop button:hover{ background:var(--accent-soft); }
  .dpop button.on{ background:var(--accent-warm); color:#fff; }
  .dpop button .n{ min-width:22px; height:20px; border-radius:6px; background:var(--bg); color:var(--text-dim); display:inline-flex; align-items:center; justify-content:center; font-size:11px; }
  .dpop button.on .n{ background:rgba(255,255,255,.25); color:#fff; }
  .dpop .none{ color:var(--text-faint); }
  /* 매입일지에서 발견된 미등록 업체 */
  .dgroup.unreg{ color:var(--danger); } .dgroup.unreg .gnum{ background:var(--danger); }
  .drow.unreg{ border-style:dashed; }
  .drow.unreg .dn{ color:var(--danger); }
  .drow.unreg .dk{ font-size:11.5px; }
  .empty{ text-align:center; color:var(--text-faint); font-size:13px; font-weight:700; padding:26px 6px; border:2px dashed var(--border); border-radius:12px; }

  .toast{ position:fixed; top:26px; left:50%; transform:translateX(-50%) translateY(-16px); background:var(--text); color:#fff;
    padding:14px 24px; border-radius:12px; font-size:15px; font-weight:800; opacity:0; pointer-events:none; transition:all .25s; z-index:9999; }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
  .toast.success{ background:var(--success); } .toast.error{ background:var(--danger); }
  .modal-bg{ position:fixed; inset:0; background:rgba(30,27,22,.45); backdrop-filter:blur(4px); z-index:500; display:none; align-items:center; justify-content:center; padding:20px; }
  .modal-bg.show{ display:flex; }
  .modal{ background:var(--bg-elev); border:1px solid var(--border-bright); border-radius:16px; padding:26px; max-width:400px; width:100%; box-shadow:0 30px 80px rgba(30,27,22,.2); }
  .modal h3{ font-size:19px; font-weight:800; margin-bottom:10px; }
  .modal h3.warn{ color:var(--danger); }
  .modal p{ color:var(--text-dim); font-size:14px; font-weight:600; line-height:1.6; margin-bottom:18px; white-space:pre-wrap; word-break:break-word; }
  .modal .macts{ display:flex; gap:8px; justify-content:flex-end; }
  /* 유사 이름 — 여러 개 등록 (칩) */
  .alias-box{ display:flex; flex-wrap:wrap; gap:6px; align-items:center; border:1.5px solid var(--border); border-radius:10px; padding:6px 8px; background:var(--bg); min-height:46px; }
  .alias-box:focus-within{ border-color:var(--accent-warm); background:#fff; }
  .alias-chip{ display:inline-flex; align-items:center; gap:5px; background:var(--accent-soft); color:var(--text); border:1px solid var(--border); border-radius:999px; padding:4px 6px 4px 10px; font-size:12px; font-weight:800; }
  .alias-chip button{ border:none; background:transparent; color:var(--text-faint); font-size:13px; font-weight:800; cursor:pointer; line-height:1; padding:0 2px; }
  .alias-chip button:hover{ color:var(--danger); }
  .alias-box input{ flex:1 1 140px; min-width:120px; border:none !important; background:transparent !important; padding:6px 4px !important; font:inherit; font-size:14px; font-weight:700; outline:none; }
  .alias-add{ border:1px solid var(--border); background:var(--bg-elev); color:var(--accent-warm); border-radius:8px; padding:6px 10px; font:inherit; font-size:12px; font-weight:800; cursor:pointer; white-space:nowrap; }
  .alias-add:hover{ border-color:var(--accent-warm); }
  .gate-note{ position:fixed; inset:0; z-index:9000; display:none; align-items:center; justify-content:center; background:var(--bg); }
  .gate-note.show{ display:flex; }
  .gate-note .gc{ background:var(--bg-elev); border:1.5px solid var(--border); border-radius:16px; padding:34px 40px; text-align:center; font-weight:800; color:var(--text-dim); line-height:1.8; }

  .dal{ display:block; margin-top:2px; font-size:11px; font-weight:700; color:var(--accent-warm); word-break:break-all; }
  @media (max-width:760px){
    .addgrid{ grid-template-columns:1fr 1fr; }
    .addgrid .btn{ grid-column:1/-1; }
    .dlist{ grid-template-columns:1fr; }
  }
</style>
</head>
<body>
<div class="toast" id="toast"></div>
<div class="gate-note" id="gateNote"><div class="gc">EGMM 포털을 통해 접속하세요</div></div>

<div class="wrap">
  <div class="page-topbar">
    <h1>VENDER<small>업체 관리</small></h1>
    <span class="live">● LIVE</span>
  </div>
  <div class="banner" id="fbBanner"></div>

  <div class="panel">
    <h2><span id="addTitle">업체 추가</span></h2>
    <div class="addgrid">
      <div class="field"><label>업체명</label><input type="text" id="dName" placeholder="" autocomplete="off"></div>
      <div class="field"><label>한글명 (선택)</label><input type="text" id="dKo" placeholder="" autocomplete="off"></div>
      <div class="field"><label>축약어 (VENDER 코드)</label><input type="text" id="dCode" placeholder="" autocomplete="off"></div>
      <div class="field"><label>영업 품목 종류</label><input type="text" id="dItems" placeholder="" autocomplete="off"></div>
      <div class="field"><label>부서 (카테고리)</label><select id="dDept"><option value="">— 미지정 —</option></select></div>
      <div class="field" style="grid-column:1/-1"><label>유사 이름 (이 업체로 인식할 다른 표기 · 여러 개 등록 가능)</label>
        <div class="alias-box"><span id="aliasChips" style="display:contents"></span><input type="text" id="dAliases" placeholder="" autocomplete="off"><button class="alias-add" id="aliasAddBtn" type="button">추가</button></div></div>
      <button class="btn" id="dSaveBtn" type="button">추가</button>
    </div>
    <div style="margin-top:10px; display:none;" id="editActs">
      <button class="btn ghost sm" id="dCancelBtn" type="button">수정 취소</button>
    </div>
  </div>

  <div class="panel list">
    <h2>업체 목록 <span class="cnt" id="dCnt"></span></h2>
    <div class="sortbar" id="sortBar">정렬:
      <button class="sb" data-sort="code" type="button">축약어</button>
      <button class="sb" data-sort="name" type="button">업체명</button>
      <button class="sb" data-sort="nameKo" type="button">한글명</button>
      <button class="sb" data-sort="items" type="button">영업 품목</button>
      <button class="sb" data-sort="aliases" type="button">유사 이름</button>
      <button class="sb" data-sort="manual" type="button">직접 순서 (▲▼)</button>
      <button class="sb dir" id="sortDir" type="button" title="오름차순 / 내림차순">▲ 오름차순</button>
    </div>
    <div class="dlist" id="dList"></div>
  </div>
</div>

<div class="modal-bg" id="modalBg"><div class="modal">
  <h3 id="mTitle"></h3><p id="mText"></p>
  <div class="macts"><button class="btn ghost sm" id="mCancel" type="button">취소</button><button class="btn sm" id="mOk" type="button">확인</button></div>
</div></div>

<script src="../FUNCTION-FIREBASE-EGMM.js"></script>
<script src="../FUNCTION-ACCESS-GATE.js"></script>
<script>
(function(){
  'use strict';
  var $=function(id){ return document.getElementById(id); };
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]; }); }

  var toastTimer;
  function toast(m,t){ var el=$('toast'); clearTimeout(toastTimer); el.textContent=m; el.className='toast show '+(t||'');
    toastTimer=setTimeout(function(){ el.className='toast '+(t||''); },2400); }

  var modalCb=null;
  function askConfirm(title,text,cb,okLabel,warn){
    $('mTitle').textContent=title; $('mTitle').className=warn?'warn':'';
    $('mText').textContent=text; $('mCancel').style.display='';
    $('mOk').textContent=okLabel||'확인'; modalCb=cb; $('modalBg').classList.add('show');
  }
  function warnPopup(title,text){
    $('mTitle').textContent=title; $('mTitle').className='warn';
    $('mText').textContent=text; $('mCancel').style.display='none';
    $('mOk').textContent='닫기'; modalCb=null; $('modalBg').classList.add('show');
  }
  $('mOk').onclick=function(){ $('modalBg').classList.remove('show'); if(modalCb){ var cb=modalCb; modalCb=null; cb(); } };
  $('mCancel').onclick=function(){ $('modalBg').classList.remove('show'); modalCb=null; };
  $('modalBg').addEventListener('click',function(e){ if(e.target===$('modalBg')){ $('modalBg').classList.remove('show'); modalCb=null; } });

  var fb=null, depts={}, editingCode=null; /* depts = 업체(VENDER) 문서: {code,name,nameKo,items,aliases,dept,order} */
  var deptList=[];   /* DEPARTMENT 문서 [{code,name,nameKo,num,order}] — 번호(num)/order 순 · 카테고리 */
  function deptName(code){ for(var i=0;i<deptList.length;i++){ if(deptList[i].code===code) return deptList[i].name||code; } return code||''; }
  function fillDeptSelect(){ var sel=$('dDept'); if(!sel) return; var keep=sel.value;
    sel.innerHTML='<option value="">— 미지정 —</option>'+deptList.map(function(d){ return '<option value="'+esc(d.code)+'">'+(d.num!=null?esc(d.num)+'. ':'')+esc(d.name||d.code)+(d.nameKo?' · '+esc(d.nameKo):'')+'</option>'; }).join('');
    sel.value=keep; if(editingCode&&depts[editingCode]) sel.value=depts[editingCode].dept||''; }
  /* 유사 이름 비교 키 — 대소문자·공백·기호 무시 (EgmmFB.venderKey 와 동일) */
  function akey(s){ return String(s==null?'':s).toUpperCase().replace(/[^A-Z0-9\uAC00-\uD7A3\u3131-\u318E]/g,''); }
  function aliasesOf(d){ return Array.isArray(d&&d.aliases)?d.aliases.map(function(x){ return String(x||'').trim(); }).filter(Boolean):[]; }
  function aliasText(d){ return aliasesOf(d).join(', '); }

  function fbFail(msg){
    var b=$('fbBanner');
    b.innerHTML='⚠️ '+esc(msg)+' — <code>FUNCTION-FIREBASE-EGMM.js</code> 상단의 egmm-hq-it 설정(apiKey 등)을 입력한 뒤 새로고침하세요.';
    b.classList.add('show');
  }
  if(!window.EgmmFB || !window.AccessGate){ fbFail('공용 모듈(FUNCTION-FIREBASE-EGMM.js · FUNCTION-ACCESS-GATE.js) 로드 필요'); return; }
  /* 관리자 모드: LV-0 계정만 입장 (EGMM.html LV-0 로그인 세션은 통과) */
  window.AccessGate.require({ level0:true, title:'VENDER · ADMIN' }).then(function(){
  window.EgmmFB.ready.then(function(f){
    fb=f;
    fb.onSnapshot(fb.collection(fb.db,'VENDER'), function(snap){
      depts={}; snap.forEach(function(ds){ if(ds.id.charAt(0)==='_') return; depts[ds.id]=ds.data()||{}; });
      renderList();
    }, function(e){ console.error(e); fbFail('VENDER 실시간 연결 오류'); });
    /* 카테고리 = DEPARTMENT 관리 부서 (번호 순) */
    fb.onSnapshot(fb.collection(fb.db,'DEPARTMENT'), function(snap){
      var arr=[]; snap.forEach(function(ds){ if(ds.id.charAt(0)==='_') return; var d=ds.data()||{}; arr.push({ code:ds.id, name:d.name||ds.id, nameKo:d.nameKo||'', num:(d.num!=null&&d.num!=='')?+d.num:null, order:(typeof d.order==='number')?d.order:999 }); });
      arr.sort(function(x,y){ var a=(x.num!=null?x.num:1e6), b=(y.num!=null?y.num:1e6); return (a-b)||(x.order-y.order)||String(x.name).localeCompare(String(y.name)); });
      deptList=arr; fillDeptSelect(); renderList();
    }, function(e){ console.warn('[VENDER] DEPARTMENT 읽기 실패', e); });
    loadUnreg();
  }).catch(function(){ fbFail('Firebase 설정이 비어 있습니다'); });
  });

  function allCodes(exceptCode){
    var set={};
    Object.keys(depts).forEach(function(c){ if(c!==exceptCode) set[c.toUpperCase()]='업체 '+(depts[c].name||c); });
    return set;
  }

  /* [정렬] 축약어·업체명·한글명·영업 품목 오름/내림 · 직접 순서(▲▼ = order 필드 저장) — 선택은 브라우저에 기억 */
  var sortKey='code', sortAsc=true;
  try{ var __ss=JSON.parse(localStorage.getItem('venderSort')||'null'); if(__ss&&__ss.key){ sortKey=__ss.key; sortAsc=__ss.asc!==false; } }catch(e){}
  function saveSort(){ try{ localStorage.setItem('venderSort',JSON.stringify({key:sortKey,asc:sortAsc})); }catch(e){} }
  function sortedCodes(){
    var codes=Object.keys(depts);
    if(sortKey==='manual'){
      codes.sort(function(a,b){ var oa=(depts[a].order!=null?depts[a].order:9999), ob=(depts[b].order!=null?depts[b].order:9999); return (oa-ob)||a.localeCompare(b); });
      return codes;
    }
    codes.sort(function(a,b){
      var va=String(sortKey==='code'?a:(sortKey==='aliases'?aliasText(depts[a]):(depts[a][sortKey]||''))), vb=String(sortKey==='code'?b:(sortKey==='aliases'?aliasText(depts[b]):(depts[b][sortKey]||'')));
      if(va===''&&vb!=='') return 1; if(vb===''&&va!=='') return -1;
      var c=va.localeCompare(vb,'ko',{sensitivity:'base',numeric:true}); if(!c) c=a.localeCompare(b);
      return sortAsc?c:-c;
    });
    return codes;
  }
  function renderSortBar(){
    Array.prototype.forEach.call($('sortBar').querySelectorAll('.sb[data-sort]'),function(b){ b.classList.toggle('on',b.getAttribute('data-sort')===sortKey); });
    $('sortDir').textContent=sortAsc?'▲ 오름차순':'▼ 내림차순'; $('sortDir').style.display=(sortKey==='manual')?'none':'';
  }
  Array.prototype.forEach.call($('sortBar').querySelectorAll('.sb[data-sort]'),function(b){ b.onclick=function(){ sortKey=b.getAttribute('data-sort'); saveSort(); renderList(); }; });
  $('sortDir').onclick=function(){ sortAsc=!sortAsc; saveSort(); renderList(); };
  function moveManual(code,dir){ /* 직접 순서: 이웃과 order 교환 → 두 문서 저장 */
    var codes=sortedCodes(), i=codes.indexOf(code), j=i+dir; if(i<0||j<0||j>=codes.length) return;
    var a=codes[i], b=codes[j];
    codes[i]=b; codes[j]=a;
    var ups=[]; codes.forEach(function(c,k){ if(depts[c].order!==k){ depts[c].order=k; ups.push(fb.setDoc(fb.doc(fb.db,'VENDER',c),{order:k,updatedAt:Date.now()},{merge:true})); } });
    renderList();
    Promise.all(ups).catch(function(e){ console.error(e); toast('순서 저장 실패 — 권한 확인','error'); });
  }
  /* ── 부서 원클릭 변경 팝오버 ── */
  var __dpop=null;
  function closeDeptPop(){ if(__dpop){ __dpop.classList.remove('show'); } }
  function openDeptPop(btn, code){
    if(!__dpop){ __dpop=document.createElement('div'); __dpop.className='dpop'; document.body.appendChild(__dpop);
      document.addEventListener('click',function(e){ if(__dpop&&!__dpop.contains(e.target)) closeDeptPop(); });
      window.addEventListener('scroll',closeDeptPop,true); window.addEventListener('resize',closeDeptPop); }
    var cur=(depts[code]&&depts[code].dept)||'';
    __dpop.innerHTML=deptList.map(function(d){ return '<button type="button" data-set="'+esc(d.code)+'" class="'+(d.code===cur?'on':'')+'"><span class="n">'+(d.num!=null?esc(d.num):'·')+'</span>'+esc(d.name||d.code)+(d.nameKo?' <small>'+esc(d.nameKo)+'</small>':'')+'</button>'; }).join('')
      +'<button type="button" data-set="" class="none'+(cur?'':' on')+'"><span class="n">·</span>미지정</button>';
    Array.prototype.forEach.call(__dpop.querySelectorAll('button[data-set]'),function(b){ b.onclick=function(e){ e.stopPropagation(); var v=b.getAttribute('data-set'); closeDeptPop();
      if(!fb) return; if(depts[code]) depts[code].dept=v; renderList();
      fb.setDoc(fb.doc(fb.db,'VENDER',code),{ dept:v, updatedAt:Date.now() },{merge:true}).then(function(){ toast(code+' → '+(v?deptName(v):'미지정'),'success'); }).catch(function(e){ console.error(e); toast('저장 실패 — 권한 확인','error'); }); }; });
    var r=btn.getBoundingClientRect(); __dpop.style.left=Math.min(r.left, window.innerWidth-230)+'px'; __dpop.style.top=(r.bottom+4)+'px'; __dpop.classList.add('show');
  }
  /* ── 매입일지(DAILY-PURCHASE)에서 쓰였지만 VENDER 에 없는 업체 — 목록 맨 위 「미등록」 그룹 ── */
  var unregNames={};   /* 이름 → {name,count,total,stores:{}} */
  function loadUnreg(){
    if(!fb) return;
    fb.getDocs(fb.collection(fb.db,'STORE')).then(function(snap){
      var codes=[]; snap.forEach(function(ds){ if(ds.id.charAt(0)!=='_') codes.push(ds.id); });
      return Promise.all(codes.map(function(sc){ return fb.getDocs(fb.collection(fb.db,'DAILY-PURCHASE',sc,'DAYS')).then(function(ds){ var out=[]; ds.forEach(function(d){ var x=d.data()||{}; (Array.isArray(x.rows)?x.rows:[]).forEach(function(r){ out.push({ store:sc, vendor:String(r.vendor||'').trim(), amount:+r.amount||0 }); }); }); return out; }).catch(function(){ return []; }); }));
    }).then(function(all){
      var m={}; all.forEach(function(rows){ rows.forEach(function(r){ if(!r.vendor) return; var k=r.vendor.toUpperCase(); if(!m[k]) m[k]={ name:r.vendor, count:0, total:0, stores:{} }; m[k].count++; m[k].total+=r.amount; m[k].stores[r.store]=1; }); });
      unregNames=m; renderList();
    }).catch(function(e){ console.warn('[VENDER] 매입일지 읽기 실패', e); });
  }
  function unregList(){
    var out=[]; Object.keys(unregNames).forEach(function(k){ var u=unregNames[k]; var hit=(window.EgmmFB&&window.EgmmFB.venderMatch)?window.EgmmFB.venderMatch(depts, u.name):null; if(!hit) out.push(u); });
    out.sort(function(a,b){ return b.count-a.count||a.name.localeCompare(b.name); }); return out;
  }
  function regFromUnreg(name){
    resetAdd(); $('dName').value=name; $('dCode').value=window.EgmmFB.sanitizeCode(name); $('dCode').dataset.touched='1'; aliasSet([name]);
    window.scrollTo(0,0); $('dCode').focus(); $('dCode').select();
  }
  function renderList(){
    renderSortBar();
    var codes=sortedCodes();
    /* 부서(카테고리)별 묶기 — DEPARTMENT 순서 · 지정 안 된 업체는 맨 아래 「미지정」 */
    var groups=deptList.map(function(d){ return { code:d.code, name:d.name, num:d.num, nameKo:d.nameKo, codes:[] }; });
    var byCode={}; groups.forEach(function(g){ byCode[g.code]=g; });
    var none={ code:'', name:'미지정 · NO DEPARTMENT', num:null, nameKo:'', codes:[] };
    codes.forEach(function(c){ var g=byCode[depts[c].dept||'']; (g||none).codes.push(c); });
    var html='';
    var un=unregList();
    if(un.length){
      html+='<div class="dgroup unreg"><span class="gnum">!</span>미등록 · 매입일지에 기록된 업체<span class="gcnt">'+un.length+'개</span></div>';
      un.forEach(function(u){ html+='<div class="drow unreg"><span class="main"><span class="l1"><span class="dn">'+esc(u.name)+'</span></span><span class="l2"><span class="dk">'+u.count+'건 · '+Object.keys(u.stores).join(', ')+'</span></span></span>'
        +'<span class="acts"><button class="btn sm" data-reg="'+esc(u.name)+'" type="button">등록</button></span></div>'; });
    }
    groups.concat([none]).forEach(function(g){
      if(!g.codes.length) return;
      html+='<div class="dgroup'+(g.code?'':' none')+'"><span class="gnum">'+(g.num!=null?esc(g.num):'·')+'</span>'+esc(g.name)+(g.nameKo?' <span class="dk">'+esc(g.nameKo)+'</span>':'')+'<span class="gcnt">'+g.codes.length+'개</span></div>';
      g.codes.forEach(function(c){
        var d=depts[c], i=codes.indexOf(c);
        html+='<div class="drow'+(c===editingCode?' edit':'')+(sortKey==='manual'?' manual':'')+'">'
          +(sortKey==='manual'?('<span class="mv"><button type="button" data-up="'+esc(c)+'"'+(i===0?' disabled':'')+'>▲</button><button type="button" data-down="'+esc(c)+'"'+(i===codes.length-1?' disabled':'')+'>▼</button></span>'):'')
          +'<span class="main"><span class="l1"><span class="dc">'+esc(c)+'</span><span class="dn">'+esc(d.name||'')+'</span>'+(d.nameKo?'<span class="dk">'+esc(d.nameKo)+'</span>':'')+'</span>'
          +((d.items||aliasesOf(d).length)?('<span class="l2">'+(d.items?'<span class="di">'+esc(d.items)+'</span>':'')+(aliasesOf(d).length?'<span class="dal">≈ '+esc(aliasText(d))+'</span>':'')+'</span>'):'')
          +'</span>'
          +'<span class="acts">'
          +'<button class="btn ghost sm" data-dept="'+esc(c)+'" type="button">'+(d.dept?esc(deptName(d.dept)):'부서')+'</button>'
          +'<button class="btn ghost sm" data-edit="'+esc(c)+'" type="button">수정</button>'
          +'<button class="btn danger sm" data-del="'+esc(c)+'" type="button">삭제</button>'
          +'</span></div>';
      });
    });
    $('dList').innerHTML = html || '<div class="empty">업체가 없습니다. 위에서 추가하세요.</div>';
    $('dCnt').textContent = codes.length? (codes.length+'개') : '';
    Array.prototype.forEach.call($('dList').querySelectorAll('button[data-edit]'),function(b){
      b.onclick=function(){ startEdit(b.getAttribute('data-edit')); };
    });
    Array.prototype.forEach.call($('dList').querySelectorAll('button[data-dept]'),function(b){
      b.onclick=function(e){ e.stopPropagation(); openDeptPop(b, b.getAttribute('data-dept')); };
    });
    Array.prototype.forEach.call($('dList').querySelectorAll('button[data-reg]'),function(b){
      b.onclick=function(){ regFromUnreg(b.getAttribute('data-reg')); };
    });
    Array.prototype.forEach.call($('dList').querySelectorAll('button[data-del]'),function(b){
      b.onclick=function(){ delDept(b.getAttribute('data-del')); };
    });
    Array.prototype.forEach.call($('dList').querySelectorAll('button[data-up]'),function(b){ b.onclick=function(){ moveManual(b.getAttribute('data-up'),-1); }; });
    Array.prototype.forEach.call($('dList').querySelectorAll('button[data-down]'),function(b){ b.onclick=function(){ moveManual(b.getAttribute('data-down'),1); }; });
  }

  /* ── 유사 이름 칩 편집기: 입력 후 Enter / [＋] 로 하나씩 추가 · 쉼표로 여러 개 한 번에 · × 로 삭제 ── */
  var aliasList=[];
  function aliasRender(){
    var box=$('aliasChips'); box.innerHTML=aliasList.map(function(a,i){ return '<span class="alias-chip">'+esc(a)+'<button type="button" data-ai="'+i+'" title="삭제">✕</button></span>'; }).join('');
    Array.prototype.forEach.call(box.querySelectorAll('button[data-ai]'),function(b){ b.onclick=function(){ aliasList.splice(+b.getAttribute('data-ai'),1); aliasRender(); }; });
  }
  function aliasAddFromInput(){
    var inp=$('dAliases'), raw=inp.value; inp.value='';
    raw.split(',').forEach(function(x){ x=x.trim(); var k=akey(x); if(!x||!k) return; if(aliasList.some(function(a){ return akey(a)===k; })) return; aliasList.push(x); });
    aliasRender(); inp.focus();
  }
  function aliasSet(arr){ aliasList=(arr||[]).slice(); $('dAliases').value=''; aliasRender(); }
  $('dAliases').addEventListener('keydown',function(e){ if(e.key==='Enter'&&!e.isComposing){ e.preventDefault(); aliasAddFromInput(); } });
  $('dAliases').addEventListener('blur',function(){ if($('dAliases').value.trim()) aliasAddFromInput(); });
  $('aliasAddBtn').onclick=aliasAddFromInput;
  /* 축약어는 자동 생성하지 않음 — 사용자가 직접 지정 (예: STI-WA) */
  $('dCode').addEventListener('input',function(){ $('dCode').dataset.touched='1'; });

  function resetAdd(){
    editingCode=null;
    $('addTitle').textContent='업체 추가';
    $('dSaveBtn').textContent='추가';
    $('dName').value=''; $('dKo').value=''; $('dCode').value=''; $('dItems').value=''; $('dDept').value=''; aliasSet([]);
    delete $('dCode').dataset.touched;
    $('editActs').style.display='none';
    renderList();
  }
  function startEdit(code){
    var d=depts[code]; if(!d) return;
    editingCode=code;
    $('addTitle').textContent='업체 수정: '+code;
    $('dSaveBtn').textContent='저장';
    $('dName').value=d.name||''; $('dKo').value=d.nameKo||''; $('dItems').value=d.items||''; $('dDept').value=d.dept||''; aliasSet(aliasesOf(d));
    $('dCode').value=code; $('dCode').dataset.touched='1';
    $('editActs').style.display='';
    renderList();
    window.scrollTo(0,0);
  }
  $('dCancelBtn').onclick=resetAdd;

  $('dSaveBtn').onclick=function(){
    if(!fb){ toast('연결 준비 중 — 잠시 후 다시','error'); return; }
    var name=$('dName').value.trim();
    var ko=$('dKo').value.trim();
    var items=$('dItems').value.split(',').map(function(x){ return x.trim(); }).filter(Boolean).join(', '); /* 영업 품목 종류 — 쉼표 구분 정리 */
    var code=window.EgmmFB.sanitizeCode($('dCode').value);
    if(!name){ toast('업체명을 입력하세요','error'); $('dName').focus(); return; }
    if(!code){ toast('축약어를 입력하세요','error'); $('dCode').focus(); return; }
    if(code.charAt(0)==='_'){ toast('사용할 수 없는 코드','error'); return; }

    var dup=allCodes(editingCode);
    if(dup[code]){ warnPopup('⚠️ 코드 중복','코드 "'+code+'" 는 이미 ['+dup[code]+'] 에서 사용 중입니다.\n다른 코드를 입력하세요.'); return; }

    /* 유사 이름: 쉼표 구분 · 빈 값/중복(비교 키 기준) 제거 */
    if($('dAliases').value.trim()) aliasAddFromInput();   /* 입력란에 남은 글자도 추가 */
    var aliases=aliasList.slice();
    /* 다른 업체의 축약어·유사 이름과 겹치면 인식이 모호해지므로 거부 (업체명은 파트별 중복 등록이 가능하므로 비교하지 않음) */
    for(var ai=0; ai<aliases.length; ai++){
      var k2=akey(aliases[ai]), hitC=null;
      Object.keys(depts).forEach(function(c){ if(c===editingCode||hitC) return; if(akey(c)===k2) hitC=c; aliasesOf(depts[c]).forEach(function(al){ if(akey(al)===k2) hitC=c; }); });
      if(hitC){ warnPopup('⚠️ 유사 이름 중복','"'+aliases[ai]+'" 는 이미 ['+hitC+' · '+(depts[hitC].name||'')+'] 의 축약어 또는 유사 이름입니다.\n한 이름은 한 업체로만 인식될 수 있습니다.'); return; }
    }

    var base = editingCode ? (depts[editingCode]||{}) : {};
    var data={ code:code, name:name, nameKo:ko, items:items, aliases:aliases, dept:($('dDept').value||''), order:(base.order!=null?base.order:Object.keys(depts).length),
      createdAt: base.createdAt||Date.now(), updatedAt: Date.now() };

    function write(){
      fb.setDoc(fb.doc(fb.db,'VENDER',code), data).then(function(){
        if(editingCode && editingCode!==code){
          return fb.deleteDoc(fb.doc(fb.db,'VENDER',editingCode));
        }
      }).then(function(){
        toast(editingCode? '저장 완료: '+code : '업체 추가됨: '+code,'success');
        resetAdd();
      }).catch(function(e){ console.error(e); toast('저장 실패 — 권한/네트워크 확인','error'); });
    }
    if(editingCode && editingCode!==code){
      askConfirm('축약어 변경','축약어를 "'+editingCode+'" → "'+code+'" 로 변경할까요?\n(문서가 새 축약어로 이동합니다 · 이미 UPC MANAGER 에 들어간 VENDER 값은 바뀌지 않습니다)', write, '변경');
    } else write();
  };

  function delDept(code){
    askConfirm('업체 삭제','업체 "'+(depts[code]&&depts[code].name||code)+'" ('+code+') 를 삭제할까요?',function(){
      fb.deleteDoc(fb.doc(fb.db,'VENDER',code))
        .then(function(){ toast('삭제됨: '+code,'success'); if(editingCode===code) resetAdd(); })
        .catch(function(e){ console.error(e); toast('삭제 실패 — 권한 확인','error'); });
    },'삭제',true);
  }
})();
</script>
</body>
</html>
